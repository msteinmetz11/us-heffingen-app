<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>US Heffingen</title>
<meta name="description" content="Schedule, results, standings, squad stats and training times of the first men's team of US Heffingen.">
<meta name="theme-color" content="#8F0311">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="US Heffingen">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

.cb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--f-body);margin-left:6px;vertical-align:2px}
.mday .pips i.c,.day .pips i.c{background:var(--gold);box-shadow:0 0 0 1px var(--accent)}
.cform{display:grid;gap:8px;margin-top:10px}
.cform input,.cform select,.cform textarea{font:16px var(--f-body);padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.cform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{font:600 15px var(--f-body);padding:10px 14px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.cbtn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.cerr{color:var(--accent);font-size:13px;min-height:1em}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
.crow:first-child{border-top:0}
.cl{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.mrow{gap:10px}
.mv{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0}
.mv .side{width:50px;gap:3px}.mv .crest{width:40px;height:40px}.mv .crest.ph{font-size:12px}.mv .side span{font:600 11px var(--f-body);letter-spacing:.04em;white-space:nowrap}
.vsx{font:600 12px var(--f-body);color:var(--muted);padding-bottom:14px}
.mr{text-align:right;flex:none;display:grid;gap:3px}.mr b{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}.mr span{font-size:12px;color:var(--muted);white-space:nowrap}
.res .mrow .score,.res summary.mrow .score{font-size:22px}
.soc{display:flex;gap:22px;margin-top:10px}.soc a{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted);text-decoration:none}
.soc i{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.soc svg{width:24px;height:24px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.socfoot{display:flex;justify-content:center;gap:22px;margin:28px 0 6px;opacity:.7}.socfoot a{color:var(--muted);display:grid;padding:6px}.socfoot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Teamfarben */
html:not(.gta)[data-team="menb"]{--accent:#B45309;--hero-bg:#B45309;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="menc"]{--accent:#5F6B0A;--hero-bg:#5F6B0A;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="women"]{--accent:#A3166B;--hero-bg:#A3166B;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u22m"]{--accent:#0B5CAD;--hero-bg:#0B5CAD;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u19w"]{--accent:#6B2FA3;--hero-bg:#6B2FA3;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u16m"]{--accent:#0F766E;--hero-bg:#0F766E;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u16w"]{--accent:#BE123C;--hero-bg:#BE123C;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u14m"]{--accent:#1E3A8A;--hero-bg:#1E3A8A;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u14w"]{--accent:#15803D;--hero-bg:#15803D;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u12m"]{--accent:#78350F;--hero-bg:#78350F;--hero-sub:rgba(255,255,255,.82)}
html:not(.gta)[data-team="u12w"]{--accent:#475569;--hero-bg:#475569;--hero-sub:rgba(255,255,255,.82)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]):not(.gta)[data-team="menb"]{--accent:#F59E3B;--accent-ink:#2A1700}
 :root:not([data-theme="light"]):not(.gta)[data-team="menc"]{--accent:#B5C443;--accent-ink:#1B2000}
 :root:not([data-theme="light"]):not(.gta)[data-team="women"]{--accent:#F06BB8;--accent-ink:#2A0018}
 :root:not([data-theme="light"]):not(.gta)[data-team="u22m"]{--accent:#6CB2F5;--accent-ink:#04182C}
 :root:not([data-theme="light"]):not(.gta)[data-team="u19w"]{--accent:#BE97EA;--accent-ink:#1E0A33}
 :root:not([data-theme="light"]):not(.gta)[data-team="u16m"]{--accent:#4FD1C5;--accent-ink:#03211E}
 :root:not([data-theme="light"]):not(.gta)[data-team="u16w"]{--accent:#F9718F;--accent-ink:#33030F}
 :root:not([data-theme="light"]):not(.gta)[data-team="u14m"]{--accent:#8FA8F0;--accent-ink:#0A1330}
 :root:not([data-theme="light"]):not(.gta)[data-team="u14w"]{--accent:#5FD38A;--accent-ink:#04200F}
 :root:not([data-theme="light"]):not(.gta)[data-team="u12m"]{--accent:#E0A06A;--accent-ink:#2A1405}
 :root:not([data-theme="light"]):not(.gta)[data-team="u12w"]{--accent:#A9B8CC;--accent-ink:#0F1722}
}
/* Heimspiel */
.home .date{border:2.5px solid var(--gold);box-shadow:0 0 0 2px rgba(253,171,26,.28)}
.card.ev.game.home{border-color:var(--gold)}
/* Uebergaenge */
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view.vin{animation:vin .28s ease-out}
@keyframes dopen{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
details.res[open]>.body{animation:dopen .22s ease-out}
@media (prefers-reduced-motion:reduce){.view.vin,details.res[open]>.body{animation:none}}
html{overscroll-behavior-y:none}
#ptr{position:fixed;left:50%;top:0;transform:translate(-50%,-48px);z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font:600 13px var(--f-body);box-shadow:0 2px 10px rgba(0,0,0,.18);pointer-events:none;opacity:0}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first club app. Slim wordmark header, one scrolling view per tab, fixed bottom tab bar.
   The next game is the single loud block (court blue); everything else stays quiet. */
/* Farben aus dem Vereinslogo: Bordeaux #8F0311 und Gold #FDAB1A */
:root{
  --bg:#F5F1F1; --surface:#FFFFFF; --ink:#1E1416; --muted:#6A5A5E; --line:#E4D8DA; --soft:#EFE5E7;
  --accent:#8F0311; --accent-ink:#FFFFFF; --gold:#FDAB1A;
  --court:#4A5568; --win:#1B7F4B; --loss:#B42318; --solid-ink:#FFFFFF;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
    --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
    --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
    --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
  --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
  --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px; margin:0 auto; padding-block:10px 104px}
button{font-family:inherit}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:6px 14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{flex:none; display:block; border-radius:50%}
.brand b{display:block; font:700 27px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase}
.brand small{display:block; font:500 12px/1.2 var(--f-body); color:var(--muted); letter-spacing:.04em; margin-top:3px}
.sample{font:600 11px var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:4px 9px; border-radius:999px; white-space:nowrap}

/* structure */
.view{display:grid; gap:14px; align-content:start}
h2.sec{font:600 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:10px 0 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.note{margin:0; font-size:13px; color:var(--muted); padding:10px 12px; border:1px dashed var(--line); border-radius:10px}
.empty b{display:block; font:600 20px/1.2 var(--f-display); letter-spacing:.01em}
.empty p{margin:6px 0 0; color:var(--muted)}
.chip{display:inline-block; font:600 11px/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:3px 6px; border-radius:6px; margin-right:6px; vertical-align:1px}

/* hero: next game */
.hero{background:var(--hero-bg); color:var(--hero-ink); border-radius:18px; padding:18px; display:grid; gap:14px; min-width:0}
.hero .eyebrow{font:600 12px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--hero-accent)}
.hero .when{font:700 46px/.95 var(--f-display); text-transform:uppercase; letter-spacing:.01em}
.herologos{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:16px}
.hvs{font:700 24px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--hero-sub); text-align:center}
.crest.xl{width:80px; height:80px}
.crest.xl.ph{font-size:24px}
.hero .meta{color:var(--hero-sub); font-size:14px; margin-top:6px}
.hero .chip{border-color:rgba(255,255,255,.4); color:var(--hero-sub)}
.hero :focus-visible{outline-color:#fff}

/* season strip */
.stats{display:grid; grid-template-columns:repeat(3,1fr)}
.stat{padding:0 12px; border-left:1px solid var(--line); min-width:0}
.stat:first-child{border-left:0; padding-left:0}
.stat b{display:block; font:700 32px/1 var(--f-display); font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.formrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
.form{display:flex; gap:6px}

.count{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}
.count > div{background:rgba(255,255,255,.14); border-radius:10px; padding:7px 4px 6px; text-align:center}
.count b{display:block; font:700 24px/1 var(--f-display); font-variant-numeric:tabular-nums; color:var(--hero-ink)}
.count span{display:block; margin-top:3px; font:600 10px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--hero-sub)}
.count.live{display:block; padding:0; background:none}
.livebtn{display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:12px 16px; border-radius:12px; background:var(--hero-ink); color:var(--hero-bg); text-decoration:none; font:700 17px/1.1 var(--f-display); letter-spacing:.06em; text-transform:uppercase}
.livebtn span{display:inline; margin:0; font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit}
.livebtn .rec{width:12px; height:12px; border-radius:50%; background:#E5202E; flex:none; animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,32,46,.55)}50%{box-shadow:0 0 0 7px rgba(229,32,46,0)}}
@media (prefers-reduced-motion:reduce){.livebtn .rec{animation:none}}
.maplink{display:inline-flex; align-items:flex-start; gap:6px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; padding-block:3px}
.maplink .pin{flex:none; margin-top:3px}
.hero .maplink{color:var(--hero-ink)}

/* games */
.game{display:grid; gap:14px}
.ghead{display:flex; gap:14px; align-items:center; min-width:0}
.date{flex:none; width:58px; position:relative; margin-top:4px; text-align:center; border-radius:10px; background:var(--surface); border:1.5px solid var(--line)}
.date::before,.date::after{content:""; position:absolute; top:-5px; width:5px; height:11px; border-radius:3px; background:var(--ink)}
.date::before{left:14px}.date::after{right:14px}
.date span{display:block; background:var(--accent); color:var(--accent-ink); border-radius:8px 8px 0 0; padding:7px 0 4px; font:700 11px/1 var(--f-body); text-transform:uppercase; letter-spacing:.08em}
.date b{display:block; padding:5px 0 7px; font:700 27px/1 var(--f-display); font-variant-numeric:tabular-nums; color:var(--ink)}
.ghead h3{margin:0; font:600 21px/1.15 var(--f-display); letter-spacing:.01em}
.ghead p{margin:3px 0 0; color:var(--muted); font-size:13px}
.ghead > div{min-width:0}
.list{padding-block:4px}
.row{display:flex; gap:14px; align-items:center; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; min-width:0}
.row:first-child{border-top:0}
.row > div:last-child{min-width:0}
.row h3{margin:0; font:600 19px/1.15 var(--f-display)}
.row p{margin:3px 0 0; color:var(--muted); font-size:13px}
.res{padding:0}
.res summary, .res .sum{list-style:none; display:flex; align-items:center; gap:14px; padding:14px 16px; min-height:56px}
.res summary{cursor:pointer}
.res summary::-webkit-details-marker{display:none}
.res .score{margin-left:auto; text-align:right; font:700 24px/1 var(--f-display); font-variant-numeric:tabular-nums; white-space:nowrap}
.res .score .dot{display:inline-grid; vertical-align:middle; margin-left:8px}
.res .body{padding:0 16px 14px}
.cap{margin:0 0 6px; font-size:12px; color:var(--muted)}
.dot{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 12px var(--f-body); color:var(--solid-ink)}
.dot.w{background:var(--win)} .dot.l{background:var(--loss)}

/* calendar */
.calhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.calhead b{font:700 30px/1 var(--f-display); letter-spacing:.01em}
.calhead span{font-size:13px; color:var(--muted)}
.strip{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x proximity; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none; width:54px; height:72px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:18px; display:grid; align-content:center; justify-items:center; gap:2px; cursor:pointer; position:relative; font-family:var(--f-body); scroll-snap-align:center; padding:0}
.day b{font:700 21px/1 var(--f-display); font-variant-numeric:tabular-nums}
.day span{font-size:12px; color:var(--muted)}
.day .pips{position:absolute; bottom:7px; display:flex; gap:3px}
.day .pips i{width:5px; height:5px; border-radius:50%; background:var(--muted)}
.day .pips i.g{background:var(--accent)}
.day[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); color:#2A1700}
.day[aria-pressed="true"] span{color:#3D2500}
.day[aria-pressed="true"] .pips i{background:#3D2500}
.dayline{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:4px}
.dayline b{font:600 20px/1.2 var(--f-display)}
.dayline span{font-size:13px; color:var(--muted)}
.tl{display:grid; grid-template-columns:46px 1fr; gap:10px}
.tt{font:600 15px/1.2 var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums; padding-top:14px}
.tc{border-left:2px solid var(--line); padding-left:12px; padding-bottom:12px; min-width:0}
.tl:last-child .tc{padding-bottom:0}
.tl.next .tc{border-left-color:var(--gold)}
.ev{padding:14px 14px 16px}
.ev.next{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
.evt{font-size:13px; color:var(--muted)}
.evt b{color:var(--ink); font-weight:600}
.vsrow{display:grid; grid-template-columns:auto 1fr auto 1fr auto; align-items:center; gap:4px}
.side{display:grid; justify-items:center; gap:4px; width:62px}
.side span{font:600 13px var(--f-body); letter-spacing:.05em}
.rec{text-align:center; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.big{font:700 30px/1 var(--f-display); font-variant-numeric:tabular-nums; text-align:center}
.crest{width:52px; height:52px; border-radius:50%; display:block; object-fit:cover}
.crest.bg{background:#fff; object-fit:contain}
.crest.ph{display:grid; place-items:center; border:2px solid var(--c,var(--line)); background:var(--soft); font:700 16px var(--f-display); letter-spacing:.03em}
.addr{margin:0; padding-top:6px; font-size:13px; color:var(--muted)}

/* tables */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:9px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.tm, th.tm{text-align:left; white-space:normal}
th{font:600 11px var(--f-body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
tr.me td{font-weight:700; background:var(--soft); background:color-mix(in srgb, var(--accent) 16%, transparent)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr:last-child td{border-bottom:0}

/* squad */
.sub{font-size:12px; color:var(--muted)}
.players{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.pl{display:grid; gap:2px; align-content:start}
.pl .no{font:700 42px/1 var(--f-display); color:var(--accent); font-variant-numeric:tabular-nums}
.pl .nm{font-weight:600; margin-top:4px}
.pl .ps{font-size:13px; color:var(--muted)}

/* info card */
.info{display:grid; gap:4px}
.info b{font-weight:600}
.info span{color:var(--muted)}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:640px; margin:0 auto}
.tabs a svg{display:block}
html.gta.gta .hero .meta,html.gta.gta .hero .meta a{text-shadow:0 1px 6px #0E0320,0 0 10px #0E0320}
.calhead{align-items:center}
#v-games.view{gap:8px}
.mnav{width:36px;height:36px;border-radius:10px;font-size:20px!important;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 24px/1 var(--f-body);cursor:pointer}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mwd{text-align:center;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0}
.mday{position:relative;height:38px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;display:grid;align-content:center;justify-items:center;gap:1px;padding:0;cursor:pointer;font-family:var(--f-body)}
.mday b{font:700 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.mday.td{border-color:var(--accent)}
.mday .pips{display:flex;gap:2px;height:5px}
.mday .pips i{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.mday .pips i.g{background:var(--accent)}
.mday[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2A1700}
.mday[aria-pressed="true"] .pips i{background:#3D2500}

.formrow .fm{display:flex;gap:4px;flex:none;flex-wrap:nowrap}
.formrow .fm .dot{width:22px;height:22px;font-size:11px}
.formrow>span{min-width:0}
.vs{display:flex;align-items:center;gap:8px;min-width:0}
.vsl{display:flex;flex:none}
.vsl .mini+.mini{margin-left:-6px}
.mini{width:24px;height:24px;border-radius:50%;object-fit:contain;background:#fff;border:1.5px solid var(--surface);box-sizing:border-box;flex:none}
.mini.ph{display:grid;place-items:center;border:1.5px solid var(--c,var(--line));background:var(--soft);font:700 8px var(--f-display);letter-spacing:0;color:var(--ink)}
.vst{min-width:0}

.tabs a{display:grid; place-items:center; min-height:46px; border-radius:10px; color:var(--muted); text-decoration:none; font:600 13px var(--f-body)}
.tabs a[aria-current="page"]{background:var(--soft); color:var(--ink); box-shadow:inset 0 -3px 0 var(--gold)}

:focus-visible{outline:3px solid var(--court); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.scout{padding:16px}
.scout h2{margin:0 0 12px;font:700 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scout .sg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 10px}
.scout .sg>div{min-width:0}
.scout .hd{display:flex;align-items:center;gap:8px;font:600 15px/1.1 var(--f-display)}
.scout .hd.r{justify-content:flex-end;text-align:right}
.scout .hd .crest{width:28px;height:28px}
.scout .lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.scout .v{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.scout .v.r{text-align:right}
.scout .v.lead{color:var(--accent)}
.scout .fm{display:flex;gap:4px}
.scout .fm.r{justify-content:flex-end}
.scout .fm .dot{width:20px;height:20px;font-size:10px}
.scout .div{grid-column:1/-1;height:1px;background:var(--line)}
.scout .h2h{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.scout .h2h .t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scout .h2h .g{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.scout .h2h .g span:first-child{color:var(--muted)}
.scout .h2h .none{font-size:14px;color:var(--muted)}

.teampick{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.teampick label{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.teampick .sel{position:relative;flex:1;min-width:0}
.teampick .sel::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.teampick select{appearance:none;-webkit-appearance:none;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 38px 11px 14px;font:600 16px var(--f-body);min-height:44px}
.teampick select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.livebtn.plain{background:rgba(255,255,255,.14);color:var(--hero-ink)}

.brand b{font-size:21px;white-space:nowrap}
.hsel select{padding-left:12px;padding-right:30px}
.hsel{position:relative;flex:none}
.hsel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.hsel select{appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 32px 8px 14px;font:600 15px var(--f-body);min-height:40px}
.hsel select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asof{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.tabs nav{display:flex}
.tabs a{flex:1 1 0;min-width:0;padding:0 2px;font-size:12.5px}
.tabs a[hidden]{display:none}
.row .tag{display:block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.row .sc{margin-left:auto;text-align:right;white-space:nowrap;font:700 20px/1.1 var(--f-display);display:flex;align-items:center;gap:8px}
.filt{display:flex;gap:8px;margin-top:2px}
.filt button{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 13px var(--f-body);min-height:38px}
.filt button[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--accent)}
/* ---------- GTA-Stil (optional, Knopf in der Kopfzeile) ---------- */
#hc{display:none}#hc{margin:6px 16px 0;text-align:center;font:italic 700 34px/1 'Barlow Condensed',Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:#fff;
text-shadow:0 0 4px #fff,0 0 12px #00F0FF,0 0 26px #00F0FF,0 0 44px #00F0FF}#hc small{display:block;font-size:13px;letter-spacing:.5em;color:#FFD23F;text-shadow:0 0 8px #FF3EA5;margin-top:4px;font-style:normal}
.stylebtn{font:700 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;width:42px;height:40px;padding:0;cursor:pointer;flex:none;margin-left:auto}
@media(max-width:430px){.top{gap:6px}.brand{gap:8px}.brand b{font-size:18px!important;letter-spacing:.03em}.brand small{font-size:11px;letter-spacing:.02em}.brand .logo{width:38px;height:38px}.hsel select{font-size:14px;padding-left:10px;padding-right:26px}#hc{font-size:27px!important;letter-spacing:.1em!important}}
.top .hsel{margin-left:0}

#welcome h1{margin:6px 0 0;font:700 40px/.98 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
#welcome p{margin:0;font-size:16px;color:rgba(255,255,255,.85);line-height:1.35}
#welcome .wl{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#FDAB1A;margin-top:6px}
#welcome .wt{display:flex;flex-wrap:wrap;gap:8px}
#welcome .wt button{font:600 14px var(--f-body);padding:9px 13px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:rgba(0,0,0,.18);color:#fff;cursor:pointer}
#welcome .wt button[aria-pressed="true"]{background:#FDAB1A;border-color:#FDAB1A;color:#2A1700}
#welcome .wgo{font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:15px;border-radius:12px;border:0;background:#fff;color:#8F0311;cursor:pointer}
#welcome .wtip{font-size:12.5px;color:rgba(255,255,255,.7);text-align:center}
#welcome .wsoc{display:flex;justify-content:center;gap:22px}
#welcome .wsoc a{color:rgba(255,255,255,.8);padding:4px;display:grid}#welcome .wsoc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#welcome.splash{justify-content:center;align-items:center;text-align:center}
#welcome.splash .wlogo{margin:0;width:120px;height:120px;animation:wpop .6s ease-out}
#welcome.splash h1{font-size:30px}
@keyframes wpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#welcome,#welcome.splash .wlogo{animation:none;transition:none}}
/* Willkommen dynamisch */
#welcome{animation:wbg 14s ease-in-out infinite alternate}
@keyframes wbg{from{background-size:100% 100%,auto}to{background-size:115% 115%,auto}}
@keyframes wup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wpopc{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes wspin{from{opacity:0;transform:translateY(-120px) rotate(-200deg)}55%{opacity:1;transform:translateY(0) rotate(0)}70%{transform:translateY(-26px)}85%{transform:translateY(0)}93%{transform:translateY(-8px)}100%{transform:translateY(0)}}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 rgba(253,171,26,.55)}50%{box-shadow:0 0 0 10px rgba(253,171,26,0)}}
#welcome:not(.splash) .wlogo{animation:wspin 1.1s cubic-bezier(.3,.7,.4,1) both}
#welcome:not(.splash) h1{animation:wup .6s .55s both}
#welcome:not(.splash) p{animation:wup .6s .7s both}
#welcome:not(.splash) .wl{animation:wup .5s .85s both}
#welcome .wt button{animation:wpopc .45s both;transition:transform .15s,background .2s}
#welcome .wt button:active{transform:scale(.93)}
#welcome:not(.splash) .wgo{animation:wup .5s 1.6s both,wpulse 2.2s 2.3s infinite}
#welcome:not(.splash) .wtip,#welcome:not(.splash) .wsoc{animation:wup .5s 1.8s both}
#welcome.splash .wlogo{animation:wspin 1s cubic-bezier(.3,.7,.4,1) both}
#welcome.splash h1{animation:wup .5s .6s both}
@media (prefers-reduced-motion:reduce){#welcome,#welcome *{animation:none!important}}
/* Scoreboard-Karten */
.res summary.sb{display:block;padding:10px 14px 12px}
.sbt{display:flex;justify-content:space-between;align-items:center;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sbm{display:flex;align-items:center;gap:6px}
.sbm .side{width:56px;flex:none;gap:3px}.sbm .crest{width:44px;height:44px}.sbm .crest.ph{font-size:13px}
.sbm .side span{font:600 12px var(--f-body);letter-spacing:.04em}
.sbm b{flex:1;text-align:center;font:500 38px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.sbm b.win{color:var(--ink);font-weight:700}
.sbm i{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--muted);flex:none}
.card.res.home{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.sbt{justify-content:center;gap:10px}
.res summary.sb{text-align:center}
.sbm{justify-content:center;align-items:flex-start}
.sbm b,.sbm i{align-self:flex-start;height:44px;display:flex;align-items:center;justify-content:center}
.sbm .side{align-items:center;justify-items:center}
.sbm{align-items:center}
.sbm b,.sbm i{align-self:center;height:auto}
/* Last games als Liste wie Next */
.card.list>details.res{border-top:1px solid var(--line)}
.card.list>details.res:first-child{border-top:0}
.card.list .res summary.sb{padding:10px 0 12px}
.card.list .res .body{padding:0 0 12px}
.card.res.home,.res.home{border-color:var(--line);box-shadow:none}
.card.list>details.res.home{border-color:var(--line)}
.sbt em{font-style:normal;color:var(--accent);font-weight:700}
/* Kalender-Seite: Wochenleiste + flache Spielzeilen */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:6px 0 4px}
.wd{border:0;background:transparent;color:var(--ink);display:grid;justify-items:center;gap:3px;padding:6px 0 4px;cursor:pointer;font-family:var(--f-body)}
.wd small{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--f-display);font-variant-numeric:tabular-nums}
.wd.td b{box-shadow:inset 0 0 0 1.5px var(--accent)}
.wd[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}.wd i.on{background:var(--gold)}
.viewtog{align-self:center;justify-self:center;background:transparent;border:0;color:var(--accent);font:600 13px var(--f-body);padding:4px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.wkhead b{flex:1;text-align:center}
.card.list.grl{padding:4px 14px}
.gr{padding:12px 0;border-top:1px solid var(--line);text-align:center}
.gr:first-child{border-top:0}
.grt{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grm{display:flex;align-items:center;justify-content:center;gap:6px}
.grm .side{width:62px;flex:none;gap:3px}.grm .crest{width:46px;height:46px}.grm .crest.ph{font-size:13px}
.grm .side span{font:600 12px var(--f-body);letter-spacing:.04em}
.grc{flex:1;display:grid;gap:4px;justify-items:center}
.grc b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.grc span{font-size:12px;color:var(--muted)}
.grp{margin:6px 0 0;font-size:13px;color:var(--muted)}
.gr.home .grc span{color:var(--accent);font-weight:600}
.grt{text-transform:none;letter-spacing:.02em;font-size:14px}.grt b{font-weight:700;color:var(--ink)}
.gside{display:grid;justify-items:center;gap:2px;width:66px;flex:none}
.gside .side{width:auto}
.gside .rc{font:600 12px var(--f-body);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.grm{align-items:center}
.grl{padding:0}
.grl .gr{padding:14px 0}
.card.list .res summary.sb{padding:14px 0}
.card.list>details.res{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.card.list>details.res:first-child{border-top:0}
.card.list>details.res:first-child summary.sb{padding-top:6px}
.card.list>details.res:last-child summary.sb{padding-bottom:6px}
.gr{border-top-color:color-mix(in srgb,var(--line) 70%,transparent)}
.grl{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.grl .gr:first-child{border-top:0}
.grl{margin:0 16px}
.wstrip{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;position:relative;margin:6px -4px 4px;-webkit-overflow-scrolling:touch}
.wstrip::-webkit-scrollbar{display:none}
.wstrip .wd{flex:0 0 calc(100% / 7);scroll-snap-align:center}
.gr .sbt{margin-bottom:6px}
.gr .sbm .gside .side{width:auto}
.gr .grc{flex:1}
.gr .grc b{font-size:38px;color:var(--ink);font-weight:700}
.gr.home .grc span{color:var(--accent);font-weight:600}
a.gr{display:block;color:inherit;text-decoration:none}
.card.list>a.gr{padding:14px 0}
.card.list>a.gr:first-child{padding-top:6px;border-top:0}
.card.list>a.gr:last-child{padding-bottom:6px}
/* Kompakter */
.sbt{font-size:11px;margin-bottom:2px}
.sbm .side,.gside{width:52px}
.sbm .crest{width:34px;height:34px}.sbm .crest.ph{font-size:11px}
.sbm .side span{font-size:11px}
.gside{gap:1px}.gside .rc{font-size:11px;line-height:1.1}
.sbm b,.grc b,.gr .grc b{font-size:28px}
.sbm i{font-size:10px}
.grc{gap:1px}.grc span{font-size:11px}
.gr{padding:8px 0}
.card.list>a.gr{padding:8px 0}
.card.list>a.gr:first-child{padding-top:2px}.card.list>a.gr:last-child{padding-bottom:2px}
.card.list .res summary.sb{padding:8px 0}
.card.list>details.res:first-child summary.sb{padding-top:2px}.card.list>details.res:last-child summary.sb{padding-bottom:2px}
.card.list{padding-top:8px;padding-bottom:8px}
.wstrip .wd{padding:2px 0 0;gap:1px}.wd b{width:32px;height:32px;font-size:17px}.wd small{font-size:10px}
.calhead b{font-size:24px}
.morebtn{padding:8px;margin-top:4px}
.calsticky{position:sticky;top:var(--toph,64px);z-index:20;background:var(--bg);padding:2px 0;min-width:0;max-width:100%;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.calsticky .wstrip{margin-bottom:0;min-width:0;width:100%}
.calsticky .filt{margin-bottom:2px}
html.tab-games .top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:8px}
.grl{border-top:0!important}
.calsticky{margin-bottom:0}
.grl .gr:first-child{padding-top:18px}
.gr .sbt{margin-bottom:6px}
</style>

var TABS=['home','games','news','settings'];
function tabOk(t){return t==='squad'?Object.keys(PLAYERS||{}).length>0:t==='training'?TRAINING_WEEK.length>0:true}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
var now=new Date();
var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function daysTo(d){return Math.round((d-today)/864e5)}
function when(n){return n<=0?'today':n===1?'tomorrow':'in '+n+' days'}
function dateTop(d){var wd=WD[d.getDay()].replace(/\.$/,''),mo=MO[d.getMonth()].replace(/\.$/,'');
  if(LANG==='de') return wd+'. '+d.getDate()+'. '+mo+'.';

  return wd+' '+d.getDate()+' '+mo}
function short(d){return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]}
function ord(n){if(LANG==='de')return n+'.';if(LANG==='fr')return n===1?'1er':n+'e';var v=n%100,x=['th','st','nd','rd'];return n+(x[(v-20)%10]||x[v]||x[0])}
function signed(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0'}
function isHome(g){return g.h.indexOf(CLUB)===0}
function opp(g){return isHome(g)?g.a:g.h}

function sorted(list){return list.slice().sort(function(a,b){return (a.date+(a.time||''))<(b.date+(b.time||''))?-1:1})}
function buildGames(){
  var played=[];
  PLAYED.forEach(function(r,i){
    var h=T[r[1]], a=T[r[2]];
    if(h===CLUB||a===CLUB){
      var g={id:'r'+i,date:r[0],h:h,a:a,us:h===CLUB?r[3]:r[4],them:h===CLUB?r[4]:r[3],lg:LEAGUE};
      var bx=BOX[r[0]]; if(bx){g.q=bx.q; g.box=bx.p}
      played.push(Object.assign(g,META[r[0]]||{}));
    }
  });
  var all=FIXTURES.concat(played,CUPGAMES);
  all.forEach(function(g){var bx=g.us!=null&&!g.box?BOX[g.date]:null; if(bx){if(bx.q)g.q=bx.q; g.box=bx.p}});
  return all;
}
var GAMES=buildGames();
function upcoming(){return sorted(GAMES.filter(function(g){return g.us==null&&pd(g.date)>=today}))}
function results(){return sorted(GAMES.filter(function(g){return g.us!=null})).reverse()}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pname(p){return p.g.split(' ')[0]+' '+p.s}
function trainings(){
  var out=[];
  for(var i=0;i<30&&out.length<8;i++){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    TRAINING_WEEK.forEach(function(w){
      if(w.d===d.getDay()&&out.length<8) out.push({id:'t'+dstr(d).replace(/-/g,''),date:d,time:w.t});
    });
  }
  return out;
}
function standings(){
  if(TEAM.table){
    return TEAM.table.map(function(r){return {t:r[0],sp:r[1],w:r[2],l:r[3],pf:r[4],pa:r[5],pts:r[6],d:r[4]-r[5],me:r[0]===CLUB}});
  }
  var m={};
  Object.keys(T).forEach(function(k){m[T[k]]={t:T[k],w:0,l:0,pf:0,pa:0,me:T[k]===CLUB}});
  PLAYED.forEach(function(r){
    var h=m[T[r[1]]], a=m[T[r[2]]];
    h.pf+=r[3]; h.pa+=r[4]; a.pf+=r[4]; a.pa+=r[3];
    if(r[3]>r[4]){h.w++;a.l++}else{a.w++;h.l++}
  });
  var rows=Object.keys(m).map(function(k){var x=m[k];x.sp=x.w+x.l;x.pts=2*x.w+x.l;x.d=x.pf-x.pa;return x});
  /* Gleichstand: wie die FLBB zuerst Mini-Tabelle (direkte Duelle der punktgleichen Teams), dann Gesamt-Korbdifferenz */
  var byPts={};
  rows.forEach(function(x){(byPts[x.pts]=byPts[x.pts]||[]).push(x)});
  Object.keys(byPts).forEach(function(k){
    var grp=byPts[k]; if(grp.length<2) return;
    var names=grp.map(function(x){return x.t});
    grp.forEach(function(x){x.mp=0;x.md=0});
    PLAYED.forEach(function(r){
      var h=T[r[1]], a=T[r[2]];
      if(names.indexOf(h)<0||names.indexOf(a)<0) return;
      var hx=grp[names.indexOf(h)], ax=grp[names.indexOf(a)];
      hx.mp+=r[3]>r[4]?2:1; ax.mp+=r[3]>r[4]?1:2;
      hx.md+=r[3]-r[4]; ax.md+=r[4]-r[3];
    });
  });
  rows.sort(function(a,b){return b.pts-a.pts||(b.mp||0)-(a.mp||0)||(b.md||0)-(a.md||0)||b.d-a.d});
  return rows;
}

function tickCountdown(){
  var el=document.getElementById('cd'); if(!el) return;

    if(el.dataset.mode!=='live'){

    }

  }
  var ts=Math.floor(diff/1000), m=Math.floor(ts/60), ss=ts%60, dd=Math.floor(m/1440), hh=Math.floor((m%1440)/60), mm=m%60;
  var b=el.querySelectorAll('b'); if(b.length===4){b[0].textContent=dd;b[1].textContent=hh;b[2].textContent=String(mm).padStart(2,'0');b[3].textContent=String(ss).padStart(2,'0')}

function teamStats(name){
  if(TEAM.table){
    var row=null; standings().forEach(function(x,i){if(x.t===name){row=x;row.rank=i+1}});
    if(!row||!row.sp) return {n:0};
    return {w:row.w,l:row.l,rank:row.rank,ppg:row.pf/row.sp,opg:row.pa/row.sp,d:row.d,form:[],n:row.sp};
  }
  var rows=PLAYED.filter(function(r){return T[r[1]]===name||T[r[2]]===name}).slice().sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0});
  var w=0,l=0,pf=0,pa=0,form=[];
  rows.forEach(function(r){
    var home=T[r[1]]===name, f=home?r[3]:r[4], a=home?r[4]:r[3];
    pf+=f;pa+=a; if(f>a)w++;else l++; form.push(f>a?'W':'L');
  });
  var n=rows.length||1;
  var st=standings(), rank=st.findIndex(function(x){return x.t===name})+1;
  return {w:w,l:l,rank:rank,ppg:pf/n,opg:pa/n,d:pf-pa,form:form.slice(-5),n:rows.length};
}

}
function scout(g){
  var name=opp(g), a=teamStats(CLUB), b=teamStats(name);
  if(!a.n||!b.n) return '';
  function f1(x){return x.toFixed(1)}
  function row(label,l,r,lLead,rLead){
    return '<div class="v'+(lLead?' lead':'')+'">'+l+'</div><div class="lb">'+label+'</div><div class="v r'+(rLead?' lead':'')+'">'+r+'</div>';
  }
  var h='<section class="card scout" aria-label="'+L('Opponent preview')+'"><h2>'+L('Opponent preview')+'</h2><div class="sg">'
    +'<div class="hd">'+crestBig(CLUB).replace('crest xl','crest')+'<span>'+esc(abbr(CLUB))+'</span></div><div></div>'
    +'<div class="hd r"><span>'+esc(abbr(name))+'</span>'+crestBig(name).replace('crest xl','crest')+'</div>'
    +row(L('Standings'),ord(a.rank),ord(b.rank),a.rank<b.rank,b.rank<a.rank)
    +row(L('Record'),a.w+'–'+a.l,b.w+'–'+b.l,a.w>b.w,b.w>a.w)
    +row(L('Points / game'),f1(a.ppg),f1(b.ppg),a.ppg>b.ppg,b.ppg>a.ppg)
    +row(L('Allowed / game'),f1(a.opg),f1(b.opg),a.opg<b.opg,b.opg<a.opg)
    +(a.form.length||b.form.length?'<div>'+formDots(a.form,false)+'</div><div class="lb">'+L('Last 5')+'</div><div>'+formDots(b.form,true)+'</div>':'')
    +'</div>';
  var met=results().filter(function(x){return opp(x)===name}).reverse();
  h+='<div class="h2h"><div class="t">'+L('This season vs')+' '+esc(name)+'</div>';
  if(!met.length) h+='<div class="none">'+L('No meeting yet this season.')+'</div>';
  met.forEach(function(x){
    var win=x.us>x.them, d=pd(x.date);
    h+='<div class="g"><span>'+short(d)+' · '+(x.lg===CUP?L('Cup')+' · ':'')+venue(x)+'</span><span><b>'+score(x)+'</b> <span class="dot '+(win?'w':'l')+'" style="display:inline-grid;vertical-align:middle;margin-left:6px">'+L(win?'W':'L')+'</span></span></div>';
  });
  return h+'</div></section>';
}

    body+='<p class="cap">'+L('Score by quarter')+'</p><div class="scroll"><table><thead><tr><th>'+L('Team')+'</th>'+g.q.map(function(x,i){return '<th>'+(i<4?i+1:'OT')+'</th>'}).join('')+'<th>'+L('Total')+'</th></tr></thead><tbody>'
      +'<tr class="me"><td>Heffingen</td>'+g.q.map(function(q){return '<td>'+q[0]+'</td>'}).join('')+'<td>'+tot(0)+'</td></tr>'
      +'<tr><td>'+esc(opp(g))+'</td>'+g.q.map(function(q){return '<td>'+q[1]+'</td>'}).join('')+'<td>'+tot(1)+'</td></tr></tbody></table></div>';
  } else {
    body+='<div class="scroll"><table><thead><tr><th>'+L('Team')+'</th><th>'+L('Final score')+'</th></tr></thead><tbody>'
      +'<tr class="me"><td>Heffingen</td><td>'+g.us+'</td></tr><tr><td>'+esc(opp(g))+'</td><td>'+g.them+'</td></tr></tbody></table></div>'
      +'<p class="cap" style="margin-top:10px">'+L('Margin')+': '+signed(g.us-g.them)+(g.addr?' · '+esc(g.addr):'')+'</p>';
  }
  if(g.box){
    var h3=g.box.some(function(r){return r[5]!=null}), hs=g.box.some(function(r){return r[6]!=null});
    body+='<p class="cap" style="margin-top:14px">'+L(hs?'Points by player (* started)':'Points by player')+'</p><div class="scroll"><table><thead><tr><th>#</th><th class="tm">'+L('Player')+'</th><th>PTS</th>'+(h3?'<th>3P</th>':'')+'</tr></thead><tbody>'
      +g.box.slice().sort(function(a,b){return b[2]-a[2]||a[1]-b[1]}).map(function(r){return '<tr><td>'+r[1]+(r[6]?'*':'')+'</td><td class="tm">'+esc(pname(PLAYERS[r[0]]))+'</td><td>'+r[2]+'</td>'+(h3?'<td>'+r[5]+'</td>':'')+'</tr>'}).join('')
      +'</tbody></table></div>';
  } else if(!(g.q&&g.q.length)){
    body+='<p class="cap">'+L('No detailed statistics for this game yet.')+'</p>';
  }
  return '<details class="res'+(isHome(g)?' home':'')+'" data-key="res-'+g.id+'"><summary class="sb">'+head+'</summary><div class="body">'+body+'</div></details>';
}
function vStart(){
  var up=upcoming(), ng=nextGame(), r=results(), h='';
  if(ng){
    var d=pd(ng.date);
    h+='<section class="hero" aria-label="'+L('Next game')+'"><div><div class="eyebrow">'+L('Next game')+'</div>'
      +'<div class="when" style="margin-top:8px">'+short(d)+' · '+(ng.time||L('Time tbc'))+'</div>'
      +'<div class="herologos" role="img" aria-label="'+esc(ng.h+' versus '+ng.a)+'">'+crestBig(ng.h)+'<span class="hvs">vs</span>'+crestBig(ng.a)+'</div>'
      +'<div class="count" id="cd" data-ts="'+startOf(ng).getTime()+'" role="timer" aria-label="Time until tip-off"><div><b>0</b><span>'+L('days')+'</span></div><div><b>0</b><span>'+L('hours')+'</span></div><div><b>0</b><span>'+L('min')+'</span></div><div><b>0</b><span>'+L('sec')+'</span></div></div>'
      +'<div class="meta">'+sub(ng)+(ng.addr?'<br>'+maplink(ng.addr):'')+'</div></div>'
      +'</section>'+scout(ng);
  } else {
    h+=empty(L('No more games'),L('There are no upcoming games in the schedule.'));
  }
  h+=teamNote();
  h+=coachHome();
  var more=ng?up.filter(function(g){return g!==ng&&startOf(g)>startOf(ng)}).slice(0,3):[];
  if(more.length){
    h+='<h2 class="sec">'+L('Next')+'</h2><div class="card list">';
    more.forEach(function(g){
      var gd=pd(g.date);
      var rm=recMap();
      function gs(n){return '<div class="gside">'+crest(n)+'<em class="rc">'+(rm[n]||'&nbsp;')+'</em></div>'}
      h+='<a class="gr'+(isHome(g)?' home':'')+'" href="#games"><div class="sbt"><span>'+dateTop(gd)+(g.lg===CUP?' · '+L('Cup'):'')+(g.round?' · '+esc(L(g.round)):'')+'</span></div>'
        +'<div class="sbm" role="group" aria-label="'+esc(g.h+' versus '+g.a)+'">'+gs(g.h)+'<div class="grc"><b>'+(g.time||L('TBC'))+'</b><span>'+venue(g)+'</span></div>'+gs(g.a)+'</div></a>';
    });
    h+='</div>';
  }
  if(r.length){
    h+='<h2 class="sec">'+L('Last games')+'</h2><div class="card list">'+r.slice(0,showAllRes?5:2).map(resultCard).join('')+'</div>';
    if(r.length>2) h+='<button class="morebtn" data-allres>'+L(showAllRes?'Show less':'Show more')+'</button>';
  }
  return h;
}

document.addEventListener('click',function(e){

    if(/^\d{4}-\d\d-\d\d$/.test(un)){var pa=ev.date.split('-'),pb=un.split('-');weeks=Math.floor((Date.UTC(+pb[0],pb[1]-1,+pb[2])-Date.UTC(+pa[0],pa[1]-1,+pa[2]))/6048e5)+1; if(weeks>52)weeks=52; if(weeks<1)weeks=1}
    var okf=function(){coachMsg=L('Saved.');sbLoad();render()}, erf=function(){coachMsg=L('Could not save. You may need Contributor access.');render()};
    if(sbOn()){var pr={p_code:coachCode,p_team:ev.team,p_kind:ev.kind,p_date:ev.date,p_time:ev.time,p_title:ev.title,p_place:ev.place,p_note:ev.note};
      if(weeks>1){pr.p_weeks=weeks;sb('rpc/coach_add_series',pr).then(okf,erf)}else sb('rpc/coach_add',pr).then(okf,erf);return}
    var ser=weeks>1?'s'+Date.now().toString(36):null, jobs=[];
    for(var wi=0;wi<weeks;wi++){(function(wi){var e2={},k;for(k in ev)e2[k]=ev[k];var pd0=ev.date.split('-'),dd=new Date(Date.UTC(+pd0[0],pd0[1]-1,+pd0[2]+wi*7));e2.date=dd.getUTCFullYear()+'-'+String(dd.getUTCMonth()+1).padStart(2,'0')+'-'+String(dd.getUTCDate()).padStart(2,'0');if(ser)e2.series=ser;e2.ts=Date.now();var id='e'+e2.ts.toString(36)+Math.random().toString(36).slice(2,6)+wi;
      jobs.push(cdb.collection('coach_events').doc(id).set(e2).then(function(){e2.id=id;if(!CEV.some(function(x){return x.id===id}))CEV.push(e2)}))})(wi)}
    Promise.all(jobs).then(function(){coachMsg=L('Saved.');render()},function(){coachMsg=L('Could not save. You may need Contributor access.');render()});return}
  var ds=q('[data-cdels]');

      else Promise.all(cs.map(function(x){return cdb.collection('coach_events').doc(x.id).delete()})).then(function(){CEV=CEV.filter(function(x){return x.series!==sid});render()},function(){coachMsg=L('Could not delete.');render()})}
    return}
  var dl=q('[data-cdel]');
  if(dl){var id=dl.dataset.cdel,ce=CEV.filter(function(x){return x.id===id})[0]; if(ce&&coachTeams&&coachTeams.indexOf(ce.team)>-1&&sbOn()){sb('rpc/coach_del',{p_code:coachCode,p_id:id}).then(function(){CEV=CEV.filter(function(x){return x.id!==id});render()},function(){coachMsg=L('Could not delete.');render()});return}
  if(ce&&coachTeams&&coachTeams.indexOf(ce.team)>-1){cdb.collection('coach_events').doc(id).delete().then(function(){CEV=CEV.filter(function(x){return x.id!==id});render()},function(){coachMsg=L('Could not delete.');render()})}return}
  var st=q('.tabs a[data-tab="settings"]');
  if(st){clearTimeout(st._t);st._n=(st._n||0)+1;if(st._n>=5){st._n=0;coachOpen=true;if(location.hash==='#settings')render()}else st._t=setTimeout(function(){st._n=0},2000)}
},true);

/* Zieh zum Aktualisieren */
(function(){
  var ind=document.createElement('div'); ind.id='ptr'; document.body.appendChild(ind);
  var y0=null,dy=0,busy=false;
  function busyField(){var a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
  addEventListener('touchstart',function(e){ if(busy||busyField()||(window.scrollY||0)>0||e.touches.length!==1){y0=null;return} y0=e.touches[0].clientY; dy=0; },{passive:true});
  addEventListener('touchmove',function(e){
    if(y0==null) return; dy=e.touches[0].clientY-y0;
    if(dy<=0){ind.style.opacity=0;return}
    if((window.scrollY||0)>0){y0=null;ind.style.opacity=0;return}
    var p=Math.min(dy*.5,90); ind.textContent=L(p>=60?'Release to refresh':'Pull to refresh');
    ind.style.opacity=Math.min(1,p/40); ind.style.transform='translate(-50%,'+(p-30)+'px)';
  },{passive:true});
  addEventListener('touchend',function(){
    if(y0==null) return; var go=dy*.5>=60; y0=null;
    if(go){ busy=true; ind.textContent=L('Refreshing…'); ind.style.opacity=1; ind.style.transform='translate(-50%,30px)'; setTimeout(function(){location.reload()},250); }
    else { ind.style.opacity=0; ind.style.transform='translate(-50%,-48px)'; }
  },{passive:true});
})();
