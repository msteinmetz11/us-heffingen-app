<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>US Heffingen</title>
<meta name="description" content="Schedule, results, standings, squad stats and training times of the first men's team of US Heffingen.">
<meta name="theme-color" content="#8F0311">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="US Heffingen">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first club app. Slim wordmark header, one scrolling view per tab, fixed bottom tab bar.
   The next game is the single loud block (court blue); everything else stays quiet. */
/* Farben aus dem Vereinslogo: Bordeaux #8F0311 und Gold #FDAB1A */
:root{
  --bg:#F5F1F1; --surface:#FFFFFF; --ink:#1E1416; --muted:#6A5A5E; --line:#E4D8DA; --soft:#EFE5E7;
  --accent:#8F0311; --accent-ink:#FFFFFF; --gold:#FDAB1A;
  --court:#4A5568; --win:#1B7F4B; --loss:#B42318; --solid-ink:#FFFFFF;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
    --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
    --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
    --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
  --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
  --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px; margin:0 auto; padding-block:10px 104px}
button{font-family:inherit}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:6px 14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{flex:none; display:block; border-radius:50%}
.brand b{display:block; font:700 27px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase}
.brand small{display:block; font:500 12px/1.2 var(--f-body); color:var(--muted); letter-spacing:.04em; margin-top:3px}
.sample{font:600 11px var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:4px 9px; border-radius:999px; white-space:nowrap}

/* structure */
.view{display:grid; gap:14px; align-content:start}
h2.sec{font:600 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:10px 0 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.note{margin:0; font-size:13px; color:var(--muted); padding:10px 12px; border:1px dashed var(--line); border-radius:10px}
.empty b{display:block; font:600 20px/1.2 var(--f-display); letter-spacing:.01em}
.empty p{margin:6px 0 0; color:var(--muted)}
.chip{display:inline-block; font:600 11px/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:3px 6px; border-radius:6px; margin-right:6px; vertical-align:1px}

/* hero: next game */
.hero{background:var(--hero-bg); color:var(--hero-ink); border-radius:18px; padding:18px; display:grid; gap:14px; min-width:0}
.hero .eyebrow{font:600 12px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--hero-accent)}
.hero .when{font:700 46px/.95 var(--f-display); text-transform:uppercase; letter-spacing:.01em}
.herologos{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:16px}
.hvs{font:700 24px/1 var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--hero-sub); text-align:center}
.crest.xl{width:80px; height:80px}
.crest.xl.ph{font-size:24px}
.hero .meta{color:var(--hero-sub); font-size:14px; margin-top:6px}
.hero .chip{border-color:rgba(255,255,255,.4); color:var(--hero-sub)}
.hero :focus-visible{outline-color:#fff}

/* season strip */
.stats{display:grid; grid-template-columns:repeat(3,1fr)}
.stat{padding:0 12px; border-left:1px solid var(--line); min-width:0}
.stat:first-child{border-left:0; padding-left:0}
.stat b{display:block; font:700 32px/1 var(--f-display); font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.formrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
.form{display:flex; gap:6px}

.count{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px}
.count > div{background:rgba(255,255,255,.14); border-radius:12px; padding:10px 6px 8px; text-align:center}
.count b{display:block; font:700 34px/1 var(--f-display); font-variant-numeric:tabular-nums; color:var(--hero-ink)}
.count span{display:block; margin-top:4px; font:600 11px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--hero-sub)}
.count.live{display:block; background:rgba(255,255,255,.14); border-radius:12px; padding:14px; text-align:center; font:700 22px var(--f-display); letter-spacing:.04em; text-transform:uppercase}
.maplink{display:inline-flex; align-items:flex-start; gap:6px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; padding-block:3px}
.maplink .pin{flex:none; margin-top:3px}
.hero .maplink{color:var(--hero-ink)}

/* games */
.game{display:grid; gap:14px}
.ghead{display:flex; gap:14px; align-items:center; min-width:0}
.date{flex:none; width:54px; text-align:center; border-radius:10px; background:var(--soft); padding:7px 0}
.date b{display:block; font:700 27px/1 var(--f-display); font-variant-numeric:tabular-nums}
.date span{display:block; margin-top:2px; font:600 11px var(--f-body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.ghead h3{margin:0; font:600 21px/1.15 var(--f-display); letter-spacing:.01em}
.ghead p{margin:3px 0 0; color:var(--muted); font-size:13px}
.ghead > div{min-width:0}
.list{padding-block:4px}
.row{display:flex; gap:14px; align-items:center; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; min-width:0}
.row:first-child{border-top:0}
.row > div:last-child{min-width:0}
.row h3{margin:0; font:600 19px/1.15 var(--f-display)}
.row p{margin:3px 0 0; color:var(--muted); font-size:13px}
.res{padding:0}
.res summary, .res .sum{list-style:none; display:flex; align-items:center; gap:14px; padding:14px 16px; min-height:56px}
.res summary{cursor:pointer}
.res summary::-webkit-details-marker{display:none}
.res .score{margin-left:auto; text-align:right; font:700 24px/1 var(--f-display); font-variant-numeric:tabular-nums; white-space:nowrap}
.res .score .dot{display:inline-grid; vertical-align:middle; margin-left:8px}
.res .body{padding:0 16px 14px}
.cap{margin:0 0 6px; font-size:12px; color:var(--muted)}
.dot{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 12px var(--f-body); color:var(--solid-ink)}
.dot.w{background:var(--win)} .dot.l{background:var(--loss)}

/* calendar */
.calhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.calhead b{font:700 30px/1 var(--f-display); letter-spacing:.01em}
.calhead span{font-size:13px; color:var(--muted)}
.strip{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x proximity; scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none; width:54px; height:72px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:18px; display:grid; align-content:center; justify-items:center; gap:2px; cursor:pointer; position:relative; font-family:var(--f-body); scroll-snap-align:center; padding:0}
.day b{font:700 21px/1 var(--f-display); font-variant-numeric:tabular-nums}
.day span{font-size:12px; color:var(--muted)}
.day .pips{position:absolute; bottom:7px; display:flex; gap:3px}
.day .pips i{width:5px; height:5px; border-radius:50%; background:var(--muted)}
.day .pips i.g{background:var(--accent)}
.day[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); color:#2A1700}
.day[aria-pressed="true"] span{color:#3D2500}
.day[aria-pressed="true"] .pips i{background:#3D2500}
.dayline{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:4px}
.dayline b{font:600 20px/1.2 var(--f-display)}
.dayline span{font-size:13px; color:var(--muted)}
.tl{display:grid; grid-template-columns:46px 1fr; gap:10px}
.tt{font:600 15px/1.2 var(--f-body); color:var(--muted); font-variant-numeric:tabular-nums; padding-top:14px}
.tc{border-left:2px solid var(--line); padding-left:12px; padding-bottom:12px; min-width:0}
.tl:last-child .tc{padding-bottom:0}
.tl.next .tc{border-left-color:var(--gold)}
.ev{padding:14px 14px 16px}
.ev.next{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
.evt{font-size:13px; color:var(--muted)}
.evt b{color:var(--ink); font-weight:600}
.vsrow{display:grid; grid-template-columns:auto 1fr auto 1fr auto; align-items:center; gap:4px}
.side{display:grid; justify-items:center; gap:4px; width:62px}
.side span{font:600 13px var(--f-body); letter-spacing:.05em}
.rec{text-align:center; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.big{font:700 30px/1 var(--f-display); font-variant-numeric:tabular-nums; text-align:center}
.crest{width:52px; height:52px; border-radius:50%; display:block; object-fit:cover}
.crest.bg{background:#fff; object-fit:contain}
.crest.ph{display:grid; place-items:center; border:2px solid var(--c,var(--line)); background:var(--soft); font:700 16px var(--f-display); letter-spacing:.03em}
.addr{margin:0; padding-top:6px; font-size:13px; color:var(--muted)}

/* tables */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:9px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.tm, th.tm{text-align:left; white-space:normal}
th{font:600 11px var(--f-body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
tr.me td{font-weight:700; background:var(--soft); background:color-mix(in srgb, var(--accent) 16%, transparent)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr:last-child td{border-bottom:0}

/* squad */
.sub{font-size:12px; color:var(--muted)}
.players{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.pl{display:grid; gap:2px; align-content:start}
.pl .no{font:700 42px/1 var(--f-display); color:var(--accent); font-variant-numeric:tabular-nums}
.pl .nm{font-weight:600; margin-top:4px}
.pl .ps{font-size:13px; color:var(--muted)}

/* info card */
.info{display:grid; gap:4px}
.info b{font-weight:600}
.info span{color:var(--muted)}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:640px; margin:0 auto}
.tabs a{display:grid; place-items:center; min-height:46px; border-radius:10px; color:var(--muted); text-decoration:none; font:600 13px var(--f-body)}
.tabs a[aria-current="page"]{background:var(--soft); color:var(--ink); box-shadow:inset 0 -3px 0 var(--gold)}

:focus-visible{outline:3px solid var(--court); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.scout{padding:16px}
.scout h2{margin:0 0 12px;font:700 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scout .sg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 10px}
.scout .sg>div{min-width:0}
.scout .hd{display:flex;align-items:center;gap:8px;font:600 15px/1.1 var(--f-display)}
.scout .hd.r{justify-content:flex-end;text-align:right}
.scout .hd .crest{width:28px;height:28px}
.scout .lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.scout .v{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.scout .v.r{text-align:right}
.scout .v.lead{color:var(--accent)}
.scout .fm{display:flex;gap:4px}
.scout .fm.r{justify-content:flex-end}
.scout .fm .dot{width:20px;height:20px;font-size:10px}
.scout .div{grid-column:1/-1;height:1px;background:var(--line)}
.scout .h2h{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.scout .h2h .t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.scout .h2h .g{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.scout .h2h .g span:first-child{color:var(--muted)}
.scout .h2h .none{font-size:14px;color:var(--muted)}
</style>

</head>

/* ---------- Hilfsfunktionen ---------- */
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var TABS=['home','games','standings','squad','training'];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
var now=new Date();
var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function daysTo(d){return Math.round((d-today)/864e5)}
function when(n){return n<=0?'today':n===1?'tomorrow':'in '+n+' days'}
function short(d){return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]}
function ord(n){var v=n%100,x=['th','st','nd','rd'];return n+(x[(v-20)%10]||x[v]||x[0])}
function signed(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0'}
function isHome(g){return g.h.indexOf(CLUB)===0}
function opp(g){return isHome(g)?g.a:g.h}
function title(g){return esc(g.h)+' – '+esc(g.a)}
function venue(g){return isHome(g)?'Home':'Away'}
function sub(g){return (g.lg===CUP?'<span class="chip">Cup</span>':'')+(g.round?esc(g.round)+' · ':'')+venue(g)+(g.place?' · '+esc(g.place):'')}
function score(g){return isHome(g)?g.us+':'+g.them:g.them+':'+g.us}
function sorted(list){return list.slice().sort(function(a,b){return (a.date+(a.time||''))<(b.date+(b.time||''))?-1:1})}
function buildGames(){
  var played=[];
  PLAYED.forEach(function(r,i){
    var h=T[r[1]], a=T[r[2]];
    if(h===CLUB||a===CLUB){
      var g={id:'r'+i,date:r[0],h:h,a:a,us:h===CLUB?r[3]:r[4],them:h===CLUB?r[4]:r[3],lg:LEAGUE};
      var bx=BOX[r[0]]; if(bx){g.q=bx.q; g.box=bx.p}
      played.push(Object.assign(g,META[r[0]]||{}));
    }
  });
  return FIXTURES.concat(played,CUPGAMES);
}
var GAMES=buildGames();
function upcoming(){return sorted(GAMES.filter(function(g){return g.us==null&&pd(g.date)>=today}))}
function results(){return sorted(GAMES.filter(function(g){return g.us!=null})).reverse()}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pname(p){return p.g.split(' ')[0]+' '+p.s}
function trainings(){
  var out=[];
  for(var i=0;i<30&&out.length<8;i++){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    TRAINING_WEEK.forEach(function(w){
      if(w.d===d.getDay()&&out.length<8) out.push({id:'t'+dstr(d).replace(/-/g,''),date:d,time:w.t});
    });
  }
  return out;
}
function standings(){
  var m={};
  Object.keys(T).forEach(function(k){m[T[k]]={t:T[k],w:0,l:0,pf:0,pa:0,me:T[k]===CLUB}});
  PLAYED.forEach(function(r){
    var h=m[T[r[1]]], a=m[T[r[2]]];
    h.pf+=r[3]; h.pa+=r[4]; a.pf+=r[4]; a.pa+=r[3];
    if(r[3]>r[4]){h.w++;a.l++}else{a.w++;h.l++}
  });
  var rows=Object.keys(m).map(function(k){var x=m[k];x.sp=x.w+x.l;x.pts=2*x.w+x.l;x.d=x.pf-x.pa;return x});
  rows.sort(function(a,b){return b.pts-a.pts||b.d-a.d});
  return rows;
}

function startOf(g){var d=pd(g.date),t=g.time.split(':');return new Date(d.getFullYear(),d.getMonth(),d.getDate(),+t[0],+t[1])}
function nextGame(){
  var cut=new Date().getTime()-3*36e5;

}
function tickCountdown(){
  var el=document.getElementById('cd'); if(!el) return;
  var diff=+el.dataset.ts-Date.now();
  if(diff<=0){el.classList.add('live');el.textContent='Game under way';return}
  var m=Math.floor(diff/6e4), dd=Math.floor(m/1440), hh=Math.floor((m%1440)/60), mm=m%60;
  var b=el.querySelectorAll('b'); if(b.length===3){b[0].textContent=dd;b[1].textContent=hh;b[2].textContent=mm}
  var l=el.querySelectorAll('span'); if(l.length===3){l[0].textContent=dd===1?'day':'days';l[1].textContent=hh===1?'hour':'hours'}
}

function teamStats(name){
  var rows=PLAYED.filter(function(r){return T[r[1]]===name||T[r[2]]===name}).slice().sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0});
  var w=0,l=0,pf=0,pa=0,form=[];
  rows.forEach(function(r){
    var home=T[r[1]]===name, f=home?r[3]:r[4], a=home?r[4]:r[3];
    pf+=f;pa+=a; if(f>a)w++;else l++; form.push(f>a?'W':'L');
  });
  var n=rows.length||1;
  var st=standings(), rank=st.findIndex(function(x){return x.t===name})+1;
  return {w:w,l:l,rank:rank,ppg:pf/n,opg:pa/n,d:pf-pa,form:form.slice(-5),n:rows.length};
}
function formDots(f,right){
  return '<div class="fm'+(right?' r':'')+'">'+f.map(function(x){return '<span class="dot '+(x==='W'?'w':'l')+'">'+x+'</span>'}).join('')+'</div>';
}
function scout(g){
  var name=opp(g), a=teamStats(CLUB), b=teamStats(name);
  if(!b.n) return '';
  function f1(x){return x.toFixed(1)}
  function row(label,l,r,lLead,rLead){
    return '<div class="v'+(lLead?' lead':'')+'">'+l+'</div><div class="lb">'+label+'</div><div class="v r'+(rLead?' lead':'')+'">'+r+'</div>';
  }
  var h='<section class="card scout" aria-label="Opponent preview"><h2>Opponent preview</h2><div class="sg">'
    +'<div class="hd">'+crestBig(CLUB).replace('crest xl','crest')+'<span>'+esc(ABBR[CLUB]||'HEF')+'</span></div><div></div>'
    +'<div class="hd r"><span>'+esc(ABBR[name]||name)+'</span>'+crestBig(name).replace('crest xl','crest')+'</div>'
    +row('Standings',ord(a.rank),ord(b.rank),a.rank<b.rank,b.rank<a.rank)
    +row('Record',a.w+'–'+a.l,b.w+'–'+b.l,a.w>b.w,b.w>a.w)
    +row('Points / game',f1(a.ppg),f1(b.ppg),a.ppg>b.ppg,b.ppg>a.ppg)
    +row('Allowed / game',f1(a.opg),f1(b.opg),a.opg<b.opg,b.opg<a.opg)
    +'<div>'+formDots(a.form,false)+'</div><div class="lb">Last 5</div><div>'+formDots(b.form,true)+'</div>'
    +'</div>';
  var met=results().filter(function(x){return opp(x)===name}).reverse();
  h+='<div class="h2h"><div class="t">This season vs '+esc(name)+'</div>';
  if(!met.length) h+='<div class="none">No meeting yet this season.</div>';
  met.forEach(function(x){
    var win=x.us>x.them, d=pd(x.date);
    h+='<div class="g"><span>'+short(d)+' · '+(x.lg===CUP?'Cup · ':'')+venue(x)+'</span><span><b>'+score(x)+'</b> <span class="dot '+(win?'w':'l')+'" style="display:inline-grid;vertical-align:middle;margin-left:6px">'+(win?'W':'L')+'</span></span></div>';
  });
  return h+'</div></section>';
}
function vStart(){
  var up=upcoming(), ng=nextGame(), r=results(), h='';
  if(ng){
    var d=pd(ng.date);
    h+='<section class="hero" aria-label="Next game"><div><div class="eyebrow">Next game</div>'
      +'<div class="when" style="margin-top:8px">'+short(d)+' · '+ng.time+'</div>'
      +'<div class="herologos" role="img" aria-label="'+esc(ng.h+' versus '+ng.a)+'">'+crestBig(ng.h)+'<span class="hvs">vs</span>'+crestBig(ng.a)+'</div>'
      +'<div class="count" id="cd" data-ts="'+startOf(ng).getTime()+'" role="timer" aria-label="Time until tip-off"><div><b>0</b><span>days</span></div><div><b>0</b><span>hours</span></div><div><b>0</b><span>min</span></div></div>'
      +'<div class="meta">'+sub(ng)+(ng.addr?'<br>'+maplink(ng.addr):'')+'</div></div>'
      +'</section>'+scout(ng);
  } else {
    h+=empty('No more games','There are no upcoming games in the schedule.');
  }
  if(r.length){
    var st=standings(), rank=st.findIndex(function(x){return x.me})+1, me=st[rank-1];
    var lr=r.filter(function(g){return g.lg===LEAGUE});
    var w=lr.filter(function(g){return g.us>g.them}).length, l=lr.length-w;
    h+='<section class="card" aria-label="Season record"><div class="stats">'
      +'<div class="stat"><b>'+w+'–'+l+'</b><span>Record</span></div>'
      +'<div class="stat"><b>'+ord(rank)+'</b><span>Standings</span></div>'
      +'<div class="stat"><b>'+signed(me.d)+'</b><span>Pt diff.</span></div></div>'
      +'<div class="formrow"><span>'+LEAGUE+' · Form</span><div class="form">'
      +lr.slice(0,5).reverse().map(function(g){var win=g.us>g.them;return '<span class="dot '+(win?'w':'l')+'" title="'+(win?'Win':'Loss')+'">'+(win?'W':'L')+'</span>'}).join('')
      +'</div></div></section>';
  }
  var more=ng?up.filter(function(g){return g!==ng&&startOf(g)>startOf(ng)}).slice(0,4):[];
  if(more.length){
    h+='<h2 class="sec">After that</h2><div class="card list">';
    more.forEach(function(g){
      var gd=pd(g.date);
      h+='<a class="row" href="#games">'+dateBox(gd)+'<div><h3>'+title(g)+'</h3><p>'+WD[gd.getDay()]+' · '+g.time+' · '+sub(g)+'</p></div></a>';
    });
    h+='</div>';
  }
  if(r.length){
    var last=r[0];
    h+='<a href="#games" style="text-decoration:none;color:inherit"><div class="card info"><span>Last game · '+short(pd(last.date))+'</span>'
      +'<b>'+title(last)+'</b><span>'+score(last)+(last.us>last.them?' · Win':' · Loss')+'</span></div></a>';
  }

function hue(name){var x=0;for(var i=0;i<name.length;i++)x=(x*31+name.charCodeAt(i))%360;return x}
function logoOf(name){
  if(LOGOS[name]) return LOGOS[name];
  if(name.indexOf(CLUB)===0){var i=document.querySelector('.logo');return i?i.src:''}
  return '';
}
function crest(name){
  var ab=ABBR[name]||name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(), src=logoOf(name);
  var img=src?'<img class="crest'+(LOGOS[name]?' bg':'')+'" src="'+esc(src)+'" alt="">'
    :'<span class="crest ph" style="--c:hsl('+hue(name)+' 45% 55%)">'+esc(ab)+'</span>';
  return '<div class="side">'+img+'<span>'+esc(ab)+'</span></div>';
}
function crestBig(name){
  var ab=ABBR[name]||name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase(), src=logoOf(name);
  return src?'<img class="crest xl bg" src="'+esc(src)+'" alt="">'
    :'<span class="crest xl ph" style="--c:hsl('+hue(name)+' 45% 55%)">'+esc(ab)+'</span>';
}
function recMap(){var m={};standings().forEach(function(x){m[x.t]=x.w+'–'+x.l});return m}
function dayEvents(ds,recs,nextId){
  var ev=[], d=pd(ds);
  upcoming().filter(function(g){return g.date===ds}).forEach(function(g){ev.push({t:g.time,g:g})});
  if(d>=today) TRAINING_WEEK.forEach(function(w){ if(w.d===d.getDay()) ev.push({t:w.t.slice(0,5),tr:w}) });
  ev.sort(function(a,b){return a.t<b.t?-1:a.t>b.t?1:0});
  return ev.map(function(e){
    var body, isNext=false;
    if(e.g){
      var g=e.g; isNext=g.id===nextId;
      body='<article class="card ev game'+(isNext?' next':'')+'"><div class="evt"><b>'+esc(g.lg||LEAGUE)+'</b> · '+venue(g)+(g.place?' · '+esc(g.place):'')+'</div>'
        +'<div class="vsrow" role="group" aria-label="'+esc(g.h+' versus '+g.a)+'">'+crest(g.h)+'<div class="rec">'+(recs[g.h]||'')+'</div><div class="big">'+g.time+'</div><div class="rec">'+(recs[g.a]||'')+'</div>'+crest(g.a)+'</div>'
        +(g.addr?'<p class="addr">'+maplink(g.addr)+'</p>':'')+'</article>';
    } else {
      body='<article class="card ev game"><div class="evt"><b>Training</b> · '+esc(e.tr.t)+'</div>'+'</article>';
    }
    return '<div class="tl'+(isNext?' next':'')+'"><div class="tt">'+e.t+'</div><div class="tc">'+body+'</div></div>';
  }).join('');
}
function calendar(){
  var up=upcoming(), ng0=nextGame(), nextId=ng0?ng0.id:null, recs=recMap();
  if(!selDay) selDay=up.length?up[0].date:dstr(today);
  var last=up.length?up[up.length-1].date:dstr(today);
  var end=pd(last); var min=new Date(today.getFullYear(),today.getMonth(),today.getDate()+13); if(end<min) end=min;
  var gameDays={};
  up.forEach(function(g){gameDays[g.date]=1});
  var strip='';
  for(var d=new Date(today.getTime()); d<=end; d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
    var ds=dstr(d), tr=TRAINING_WEEK.some(function(w){return w.d===d.getDay()});
    strip+='<button type="button" class="day" data-day="'+ds+'" aria-pressed="'+(ds===selDay)+'" aria-label="'+short(d)+(gameDays[ds]?', game':'')+'"><b>'+d.getDate()+'</b><span>'+WD[d.getDay()]+'</span>'
      +'<span class="pips">'+(gameDays[ds]?'<i class="g"></i>':'')+(tr?'<i></i>':'')+'</span></button>';
  }
  var sd=pd(selDay), items=dayEvents(selDay,recs,nextId);
  var n=(items.match(/class="tl/g)||[]).length;
  return '<div class="calhead"><b>'+MONTH[sd.getMonth()]+' '+sd.getFullYear()+'</b><span>'+LEAGUE+'</span></div>'
    +'<div class="strip" aria-label="Pick a day">'+strip+'</div>'
    +'<div class="dayline"><b>'+(selDay===dstr(today)?'Today':short(sd))+'</b><span>'+n+(n===1?' event':' events')+'</span></div>'
    +(n?items:empty('Nothing planned','No game or training on this day.'));
}
function vSpiele(){
  var r=results();
  var h=calendar();
  h+='<h2 class="sec">Results</h2>';
  if(!r.length) h+=empty('No results yet','Results will appear here once they are entered.');
  r.forEach(function(g){
    var d=pd(g.date), w=g.us>g.them;
    var head=dateBox(d)
      +'<div style="min-width:0"><div style="font:600 19px/1.15 var(--f-display)">'+title(g)+'</div><div style="font-size:13px;color:var(--muted)">'+sub(g)+'</div></div>'
      +'<div class="score">'+score(g)+'<span class="dot '+(w?'w':'l')+'" title="'+(w?'Win':'Loss')+'">'+(w?'W':'L')+'</span></div>';
    if(g.q&&g.q.length){
      var su=0,st=0;
      g.q.forEach(function(q){su+=q[0];st+=q[1]});
      var bx='';
      if(g.box){
        bx='<p class="cap" style="margin-top:14px">Points by player (* started)</p><div class="scroll"><table><thead><tr><th>#</th><th class="tm">Player</th><th>PTS</th><th>3P</th></tr></thead><tbody>'
          +g.box.slice().sort(function(a,b){return b[2]-a[2]||a[1]-b[1]}).map(function(r){return '<tr><td>'+r[1]+(r[6]?'*':'')+'</td><td class="tm">'+esc(pname(PLAYERS[r[0]]))+'</td><td>'+r[2]+'</td><td>'+r[5]+'</td></tr>'}).join('')
          +'</tbody></table></div>';
      }
      h+='<details class="card res" data-key="res-'+g.id+'"><summary>'+head+'</summary>'
        +'<div class="body"><p class="cap">Score by quarter</p><div class="scroll"><table><thead><tr><th>Team</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Total</th></tr></thead><tbody>'
        +'<tr class="me"><td>Heffingen</td>'+g.q.map(function(q){return '<td>'+q[0]+'</td>'}).join('')+'<td>'+su+'</td></tr>'
        +'<tr><td>'+esc(opp(g))+'</td>'+g.q.map(function(q){return '<td>'+q[1]+'</td>'}).join('')+'<td>'+st+'</td></tr>'
        +'</tbody></table></div>'+bx+'</div></details>';
    } else {
      h+='<div class="card res"><div class="sum">'+head+'</div></div>';
    }
  });
  return h;
}

function vTabelle(){
  var st=standings();
  var h='<h2 class="sec">'+LEAGUE+' Men</h2><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th class="tm">Team</th><th>P</th><th>W</th><th>L</th><th>Diff</th><th>Pts</th></tr></thead><tbody>';
  st.forEach(function(x,i){
    h+='<tr'+(x.me?' class="me"':'')+'><td>'+(i+1)+'</td><td class="tm">'+esc(x.t)+'</td><td>'+x.sp+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td>'+signed(x.d)+'</td><td>'+x.pts+'</td></tr>';
  });
  return h+'</tbody></table></div></div><p class="note">Calculated from the results on luxembourg.basketball (as of 11 Nov 2026): two points for a win, one for a loss, ties broken by point difference. The official table may differ.</p>';
}

function squadStats(){
  var m={};
  Object.keys(BOX).sort().forEach(function(d){
    BOX[d].p.forEach(function(r){
      var x=m[r[0]]||(m[r[0]]={id:r[0],gp:0,pts:0,three:0,n:null});
      x.gp++; x.pts+=r[2]; x.three+=r[5]; x.n=r[1];
    });
  });
  return Object.keys(m).map(function(k){var x=m[k];x.ppg=x.pts/x.gp;return x})
    .sort(function(a,b){return b.ppg-a.ppg||b.pts-a.pts});
}
function vKader(){
  var rows=squadStats();
  if(!rows.length) return empty('Squad coming soon','Players have not been added yet.');
  var h='<h2 class="sec">Season stats · '+LEAGUE+'</h2><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th class="tm">Player</th><th>GP</th><th>PTS</th><th>PPG</th><th>3PM</th></tr></thead><tbody>';
  rows.forEach(function(x){
    var p=PLAYERS[x.id];
    h+='<tr><td>'+x.n+'</td><td class="tm">'+esc(pname(p))+(p.pos?'<br><span class="sub">'+POS[p.pos]+(p.h?' · '+esc(p.h)+' m':'')+'</span>':'')+'</td><td>'+x.gp+'</td><td>'+x.pts+'</td><td>'+x.ppg.toFixed(1)+'</td><td>'+x.three+'</td></tr>';
  });
  return h+'</tbody></table></div></div><p class="note">From the match reports of the '+Object.keys(BOX).length+' league games played so far (as of 11 Nov 2026). The number is each player’s shirt number in his latest game. GP = games played, PPG = points per game, 3PM = three-pointers made.</p>';
}

    h+='<article class="card game"><div class="ghead">'+dateBox(s.date)
      +'<div><h3>'+short(s.date)+'</h3><p>'+esc(s.time)+' · '+when(daysTo(s.date))+'</p>'
      +(gm?'<p>Game day · '+gm.time+' · '+title(gm)+'</p>':'')+'</div></div>'+'</article>';
  });
  return h;
}

var VIEWS={home:vStart,games:vSpiele,standings:vTabelle,squad:vKader,training:vTraining};

/* ---------- Rendern ---------- */
function current(){var v=location.hash.slice(1);return TABS.indexOf(v)>-1?v:'home'}
function render(){
  var v=current();
  TABS.forEach(function(t){document.getElementById('v-'+t).hidden=(t!==v)});
  document.querySelectorAll('.tabs a').forEach(function(a){
    if(a.dataset.tab===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  var el=document.getElementById('v-'+v);
  el.innerHTML=VIEWS[v]();
  el.querySelectorAll('details[data-key]').forEach(function(d){d.open=openKeys.has(d.dataset.key)});
  var dsel=el.querySelector('.day[aria-pressed="true"]');
  if(dsel&&dsel.scrollIntoView) dsel.scrollIntoView({inline:'center',block:'nearest'});
  tickCountdown();
}
/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var dd=e.target.closest&&e.target.closest('[data-day]');
  if(dd){selDay=dd.dataset.day;render();}
});
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(d&&d.dataset&&d.dataset.key){ if(d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key); }
},true);
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

/* ---------- Start ---------- */
render();
setInterval(function(){tickCountdown();if(document.getElementById('cd')&&document.getElementById('cd').classList.contains('live'))render()},20000);
})();
</script>
