/* Aufbau wie die App des FC Koeppchen: dunkler Kopf mit Reitern, darunter Karten.
   Vereinsfarben der US Heffingen: Bordeaux #8F0311 und Gold #FDAB1A. */
:root{
  --bg:#f3f1f1; --karte:#fff; --ink:#161012; --grau:#6b6264; --linie:#e6dfe0;
  --akzent:#8F0311; --akzentHell:#fbeef0; --gold:#FDAB1A; --kopf:#140a0c; --orange:#b4540a; --rot:#d4102a;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* Kopf */
#kopf{background:var(--kopf);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px}
.top{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
#logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.top h1{margin:0;font-size:28px;line-height:1.05;letter-spacing:.05em;font-weight:800}
#unter{font-size:14px;color:#cdbfc2;margin-top:1px}
#zahnrad{margin-left:auto;background:none;border:0;font-size:28px;padding:4px;cursor:pointer}
.goldlinie{height:6px;background:linear-gradient(90deg,var(--gold),#ffc95a 50%,var(--gold))}

/* Inhalt */
main{max-width:760px;margin:0 auto;padding:16px 12px 8px}
.karte{background:var(--karte);border:2px solid var(--akzent);border-radius:18px;margin:0 0 18px;overflow:hidden}
.kk{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--akzentHell);border-bottom:1px solid #efd4d8;padding:11px 16px}
.kk h2{margin:0;font-size:21px;letter-spacing:.04em;font-weight:800}
.kk .neben{color:var(--grau);font-size:14px;text-align:right}
.kk.voll{background:var(--akzent);color:#fff;border-bottom:0}
.kk.voll .pill{background:#fff;color:var(--akzent)}
.kb{padding:12px 16px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#efe9ea;color:#4a3f41}
.klein{font-size:13px;color:var(--grau)}
.mitte{text-align:center}

/* Spielzeile: Heim [Stand] Gast */
.sp{padding:10px 0;border-bottom:1px solid var(--linie)}
.sp:last-child{border-bottom:0}
.sz{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sz .h,.sz .a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;line-height:1.25}
.ml{width:26px;height:26px;border-radius:50%;object-fit:contain;flex:none;background:#fff}
i.ml{display:inline-flex;align-items:center;justify-content:center;background:#efe9ea;font-style:normal;font-size:9px;font-weight:800;color:#6a5e60}
.sz .wir{font-weight:800}
.stand{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;border-radius:9px;padding:3px 8px;color:#fff;background:#151012;letter-spacing:.03em}
.stand.sieg{background:var(--akzent)}
.stand.neutral{background:#e9e4e5;color:#222}
.stand.offen{background:#f1eeee;color:#7a7072;font-size:14px;font-weight:700;border:1px solid #e2dcdd;min-width:64px;padding:4px 8px;border-radius:999px}
.sd{text-align:center;font-size:13px;color:var(--grau);margin-top:4px}
.datumkopf{font-size:24px;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.datumkopf small{font-family:Georgia,serif;font-size:15px;color:var(--grau)}
.tag{color:var(--akzent);font-weight:800;border-bottom:2px solid var(--akzent);padding:10px 0 4px;margin-top:6px}
.wteam{background:var(--akzent);color:#fff;font-size:14px;padding:2px 11px}
.gleich{color:var(--orange);font-weight:700}
.ort a{text-decoration:none}

/* Letztes Spiel */
.gross{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0}
.gross .t{text-align:center;font-size:15px}
.gross .t.wir{font-weight:800}
.gross .erg{font-size:48px;font-weight:300;letter-spacing:.02em;color:var(--akzent);font-variant-numeric:tabular-nums;white-space:nowrap}
.gross .erg.nl{color:#151012}
.logo{width:58px;height:58px;border-radius:50%;object-fit:contain;display:block;margin:0 auto 6px;background:#fff}
.ini{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:#efe9ea;color:#5a4e50;font-weight:800;font-size:18px;letter-spacing:.03em}
.knopf{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer;margin:10px 0 4px}
.knopf.voll{background:var(--akzent);color:#fff}
.knopf.rot{background:var(--rot);color:#fff;border-radius:999px}
.knopf.hell{background:#fff;border:2px solid var(--akzent);color:var(--akzent)}
details.hilfe{margin:6px 0 2px;text-align:center}
details.hilfe summary{color:var(--akzent);font-weight:700;cursor:pointer;font-size:15px;list-style:none}
details.hilfe summary::before{content:"▸ "}
details.hilfe[open] summary::before{content:"▾ "}
details.hilfe div{text-align:left;font-size:14px;color:#3d3436;background:#faf7f7;border-radius:10px;padding:10px 12px;margin-top:6px}
code{font-size:12px;word-break:break-all;background:#efe9ea;padding:1px 4px;border-radius:4px}

/* Spieltag-Kasten */
.heute{background:linear-gradient(135deg,var(--akzent),#5b0009);color:#fff;border-radius:18px;padding:16px;margin:0 0 18px;text-align:center}
.heute b.g{display:block;font-size:24px;letter-spacing:.02em}
.heute .z{font-size:17px;margin-top:6px}
.heute .knopf{margin-top:12px}
.heute .knopf.hell{border-color:#fff;color:#fff;background:transparent}
.heute .knopf.weiss{background:#fff;color:var(--akzent)}

/* Tabelle */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--grau);font-weight:700;text-align:right;padding:4px 4px;border-bottom:1px solid var(--linie)}
th.l,td.l{text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--linie);text-align:right;font-size:15px}
td.pl{font-weight:800;width:28px}
td.n{text-align:left;width:100%}
td.n span{display:inline-flex;align-items:center;gap:8px}
td.n .ml{width:24px;height:24px}
td.pkt{font-weight:800}
tr.wir td{background:var(--akzentHell);font-weight:800}
tr:last-child td{border-bottom:0}

/* Willkommen */
.sprache{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.sprache button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:3px 10px;font-weight:700;cursor:pointer}
.sprache button.an{border:2px solid var(--akzent);color:var(--akzent)}
.welcome h3{margin:4px 0 8px;font-size:21px}
.welcome ul{padding-left:20px;margin:6px 0}
.welcome li{margin:4px 0}

/* Mitteilungen */
#mitt{max-width:760px;margin:16px auto 0;padding:0 12px}
.wahl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin:8px 0}
.wahl label{display:flex;align-items:center;gap:8px;font-size:15px}
.wahl input{width:20px;height:20px;accent-color:var(--akzent)}

footer{max-width:760px;margin:0 auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--grau);font-size:13px}
footer .knopf{max-width:320px;margin:10px auto}
footer .sprache{justify-content:center;margin:10px 0}
.leer{color:var(--grau);text-align:center;padding:14px 4px}

/* Mannschaftswahl oben, Leiste unten */
#teamwahl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:760px;margin:12px auto 0;background:#2a1b1e;border:1px solid #4a3337;border-radius:12px;color:#fff;font-weight:800;font-size:18px;padding:9px 14px;cursor:pointer}
#teamwahl b{color:var(--gold)}
main{padding-bottom:20px}
footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
#leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #e3d9da;display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.06)}
#leiste button{flex:1;max-width:150px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:#7a6e70;padding:4px 0;cursor:pointer}
#leiste .ic{font-size:23px;line-height:1.15;position:relative;filter:grayscale(1);opacity:.75}
#leiste .an{color:var(--akzent)}
#leiste .an .ic{filter:none;opacity:1}
.punkt{position:absolute;top:0;right:-6px;width:9px;height:9px;border-radius:50%;background:var(--rot);border:2px solid #fff}
/* Blatt von unten (Mannschaftswahl, Spielbericht) */
#ueber{position:fixed;inset:0;z-index:30;background:rgba(20,10,12,.45);display:flex;align-items:flex-end;justify-content:center}
body.still{overflow:hidden}
.blatt{background:#fff;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:hoch .2s ease-out}
@keyframes hoch{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.blattkopf{display:flex;justify-content:space-between;align-items:center;font-size:19px;margin-bottom:8px}
.zu{background:#efe9ea;border:0;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.gruppe{font-size:13px;color:var(--grau);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.wahlraster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wahlraster button{background:#f6f1f2;border:2px solid transparent;border-radius:12px;padding:12px 8px;font-weight:800;font-size:16px;cursor:pointer}
.wahlraster button.an{border-color:var(--akzent);background:var(--akzentHell);color:var(--akzent)}
/* Formkurve */
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:8px;height:8px;border-radius:50%;display:inline-block}
.form i.w{background:#1f8a4c}.form i.l{background:#d23b4b}
.form.gross i{width:24px;height:24px;border-radius:7px;color:#fff;font-style:normal;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
td.n .nf{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
td{white-space:nowrap}
td.n{white-space:normal}
.serie{margin-top:8px;font-weight:800;color:#1f8a4c}.serie.n{color:var(--grau)}
.duell{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:13px;color:#f3d6da}
.duell .form i.w{background:#7ee2a4}.duell .form i.l{background:#ff9aa6}
/* Team */
.kzraster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kz{background:#faf6f6;border-radius:12px;padding:10px 6px;text-align:center}
.kz b{display:block;font-size:22px;color:var(--akzent)}
.kz span{font-size:12px;color:var(--grau)}
.scroll{overflow-x:auto}
/* Spielbericht */
.sp.mitb{cursor:pointer}
.blink{color:var(--akzent)}
table.viertel td,table.viertel th{text-align:center}
table.viertel td.l{text-align:left;font-size:13px}
td.qw{font-weight:800;color:var(--akzent)}
h3.bt{display:flex;align-items:center;gap:8px;font-size:17px;margin:16px 0 4px}
/* Termine der Trainer */
.sp.info .it{text-align:center;font-size:16px}
.sp.weg .it,.sp.weg .sz{opacity:.55;text-decoration:line-through}
.stand.tr{font-size:12px}
.rot{color:var(--rot)}
.wkopf{margin-top:8px;text-align:center}
/* News */
.nw{padding:8px 0 12px;border-bottom:1px solid var(--linie)}
.nw:last-child{border-bottom:0}
.nw h3{margin:6px 0 4px;font-size:18px}
.nwt{margin:4px 0;white-space:pre-line}
.vorsch{list-style:none;cursor:pointer;color:#3d3436}
details[open] .vorsch{display:none}
.nwl{color:var(--akzent);font-weight:700;text-decoration:none;font-size:14px}
/* Trainer-Bereich */
.cf label{display:block;font-size:13px;font-weight:700;color:#4a3f41;margin:8px 0}
.cf input:not([type=checkbox]),.cf select,.cf textarea{display:block;width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid #d9cfd1;border-radius:10px;margin-top:3px;background:#fff}
.cf label.hk{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:28px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ce{padding:9px 0;border-bottom:1px solid var(--linie);font-size:15px}
.ce.weg{opacity:.6}
.cek{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cek button{border:1px solid #d9cfd1;background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}
.code{background:var(--akzentHell);border-radius:12px;padding:12px;text-align:center;margin:8px 0}
.gcode{font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--akzent);margin:6px 0;user-select:all}
</style>
</head>

var TAGE=[['So.','Mo.','Di.','Mi.','Do.','Fr.','Sa.'],['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'],['Sun','Mon','Tue','Wed','Thu','Fri','Sat']];
var TAGE_L=[['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'],['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']];
var LANGS=['de','fr','en'];
var L=0;
function lese(k,d){try{var v=localStorage.getItem(MERK+k);return v==null?d:v}catch(e){return d}}
function merke(k,v){try{localStorage.setItem(MERK+k,v)}catch(e){}}
(function(){var l=lese('sprache',null);if(l==null){var n=(navigator.language||'de').slice(0,2);l=n==='fr'?'fr':n==='en'?'en':'de'}L=Math.max(0,LANGS.indexOf(l));document.documentElement.lang=LANGS[L]})();
function t(k,o){var s=(S[k]||[k])[L]||S[k][0];if(o)for(var x in o)s=s.split('{'+x+'}').join(o[x]);return s}

/* ---------- Hilfen ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function luxZeit(ms){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Luxembourg',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).forEach(function(x){p[x.type]=x.value});return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute}
function luxMs(l){var o=['+01:00','+02:00'];for(var i=0;i<2;i++){var ms=Date.parse(l+':00'+o[i]);if(luxZeit(ms)===l.slice(0,16))return ms}return Date.parse(l+':00+01:00')}
function jetzt(){return luxZeit(Date.now())}
function wtag(d){return new Date(d.slice(0,10)+'T12:00:00Z').getUTCDay()}
function datKurz(d){return TAGE[L][wtag(d)]+', '+(+d.slice(8,10))+'.'+(+d.slice(5,7))+'.'}
function uhr(s){return s.zeit?s.d.slice(11,16):t('uhrOffen')}
function tagePlus(d,n){var x=new Date(d.slice(0,10)+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function tageBis(d){var a=Date.parse(jetzt().slice(0,10)+'T12:00:00Z'),b=Date.parse(d.slice(0,10)+'T12:00:00Z');return Math.round((b-a)/864e5)}
function abstand(d){var n=tageBis(d);return n===0?t('heute'):n===1?t('morgen'):n>1?t('inTagen',{n:n}):''}
function istWir(n){return /^US Heffingen( [A-F])?$/.test(n)}
function gespielt(s){return s.hs!=null&&s.as!=null}
function ini(n){return n.replace(/^(US|AB|BC|BBC|AS|T71|CFBB)\s/,'').split(/\s+/).map(function(w){return w[0]}).join('').slice(0,3).toUpperCase()}

/* ---------- Daten ---------- */
var D=null, B={}, C={termine:[],news:[]}, TEAM={};

// ?r=<mannschaft> (aus einer Mitteilung) öffnet deren Spiele
(function(){var r=new URLSearchParams(location.search).get('r');if(r){if(r==='verein'){ANSICHT='mehr'}else{TK=r;ANSICHT='spiele';merke('team',r)}history.replaceState(null,'',location.pathname)}})();
var LOGOS={};
function laden(){
  if(window.LOGO_SEED)LOGOS=window.LOGO_SEED;
  else fetch('logos/index.json?'+Math.floor(Date.now()/36e5)).then(function(r){return r.ok?r.json():{}}).then(function(j){LOGOS=j||{};if(D)bauen()}).catch(function(){});
  if(window.BERICHT_SEED)B=window.BERICHT_SEED;
  else fetch('data/berichte.json?'+Math.floor(Date.now()/6e4)).then(function(r){return r.ok?r.json():{}}).then(function(j){B=j||{};if(D)bauen()}).catch(function(){});
  if(window.C_SEED)C=window.C_SEED;
  if(WORKER_URL)fetch(WORKER_URL+'?coach=liste').then(function(r){return r.json()}).then(function(j){C=j||C;if(D)bauen()}).catch(function(){});
  return (window.SEED?Promise.reject():fetch('data/heffingen.json?'+Math.floor(Date.now()/6e4),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}))
    .catch(function(){return window.SEED||null})
    .then(function(d){if(!d)return;D=d;TEAM={};D.teams.forEach(function(x){TEAM[x.key]=x});if(!TEAM[TK])TK=D.teams[0].key;bauen()});
}
function grund(n){return String(n).replace(/ [B-F]$/,'')}
function logoSrc(name,k){
  if(istWir(name))return LOGO_EIGEN;
  var f=LOGOS[grund(name)];
  if(f)return /^data:/.test(f)?f:'logos/'+f;
  var c=k&&k.logos&&(k.logos[name]||k.logos[grund(name)]);
  return c?LOGO_FLBB+c+'.jpg':null;
}
function bild(name,k,cls,ersatz){
  var src=logoSrc(name,k), e=ersatz.replace('%',esc(ini(name)));
  return src?'<img class="'+cls+'" src="'+esc(src)+'" alt="" onerror="this.outerHTML=\''+e.replace(/"/g,'&quot;')+'\'">':e;
}
function logoHtml(name,k){return bild(name,k,'logo','<div class=ini>%</div>')}
function miniLogo(name,k){return bild(name,k,'ml','<i class=ml>%</i>')}
function karte(titel,neben,inhalt,voll,extra){return '<section class="karte'+(extra?' '+extra:'')+'"><div class="kk'+(voll?' voll':'')+'"><h2>'+titel+'</h2>'+(neben?'<div class="neben">'+neben+'</div>':'')+'</div><div class="kb">'+inhalt+'</div></section>'}
function wettText(s){return s.pokal?t('pokal')+(s.runde?' · '+s.runde:''):(s.wett||'')}
function ortHtml(s){
  if(!s.ort)return '';
  var u=s.nav||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.adr||s.ort));
  return '<span class="ort">📍 <a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(s.ort)+'</a></span>';
}
function laeuftJetzt(s){var b=luxMs(s.d),n=Date.now();return s.zeit&&!gespielt(s)&&!s.tr&&n>=b&&n<b+3*3600e3}
function standHtml(s,eigen){
  if(s.tr&&s.abgesagt)return '<span class="stand offen tr">'+esc(t('abgesagt'))+'</span>';
  if(!gespielt(s))return '<span class="stand offen">'+(laeuftJetzt(s)?t('laeuftK'):t('offen'))+'</span>';
  var wirH=eigen?s.h===eigen:istWir(s.h), wirA=eigen?s.a===eigen:istWir(s.a), cls='';
  if(wirH||wirA){var sieg=wirH?s.hs>s.as:s.as>s.hs;cls=sieg?' sieg':''}else cls=' neutral';
  return '<span class="stand'+cls+'">'+s.hs+' : '+s.as+'</span>';
}
function klasseVon(s){if(!D)return null;for(var i=0;i<D.teams.length;i++){var k=D.teams[i].klasse;if(k&&k.logos&&(k.logos[s.h]||k.logos[s.a]))return k}return null}
function zeile(s,eigen,unten){
  var w=function(n){return (eigen?n===eigen:istWir(n))?' wir':''}, k=klasseVon(s);
  var hatB=gespielt(s)&&B[s.id]&&!B[s.id].leer;
  var seite=function(n,c){return '<div class="'+c+w(n)+'">'+(n?miniLogo(n,k):'')+'<span>'+esc(n||'')+'</span></div>'};
  return '<div class="sp'+(hatB?' mitb':'')+(s.abgesagt?' weg':'')+'"'+(hatB?' data-b="'+s.id+'"':'')+'><div class="sz">'+seite(s.h,'h')+standHtml(s,eigen)+seite(s.a,'a')+'</div>'+(unten?'<div class="sd">'+unten+(hatB?' · <b class="blink">📄 '+t('bericht')+'</b>':'')+'</div>':'')+'</div>';

function infoZeile(s){
  // Termin ohne Gegner (Training abgesagt, Zusatztraining, Sonstiges, Turnier)
  var ic={'Training abgesagt':'🚫','Zusatztraining':'💪','Turnier':'🏆','Sonstiges':'📋','Freundschaftsspiel':'🤝'}[s.art]||'📋';
  return '<div class="sp info'+(s.abgesagt?' weg':'')+'"><div class="it">'+ic+' <b>'+esc(t(s.art))+'</b>'+(s.gegner?' · '+esc(s.gegner):'')+(s.abgesagt&&s.art!=='Training abgesagt'?' · <b class="rot">'+t('abgesagt')+'</b>':'')+'</div>'+
    '<div class="sd">'+datKurz(s.d)+(s.zeit?' · '+uhr(s)+(s.ende?' '+t('bisUhr')+' '+esc(s.ende):''):'')+(s.ort?' · '+ortHtml(s):'')+(s.bem?'<br>'+esc(s.bem):'')+'</div></div>';
}
// Trainer-Termine als Spiel-ähnliche Einträge
function trainerTermine(team){
  return (C.termine||[]).filter(function(x){return x.team===team.key}).map(function(x){
    var spiel=x.art==='Freundschaftsspiel'&&x.gegner;
    return {tr:true,id:'tr'+x.id,art:x.art,d:x.datum+'T'+(x.zeit||'00:00'),zeit:!!x.zeit,ende:x.ende,gegner:x.gegner,abgesagt:!!x.abgesagt,bem:x.bem,
      h:spiel?(x.heim?team.n:x.gegner):null,a:spiel?(x.heim?x.gegner:team.n):null,hs:null,as:null,ort:x.ort||'',adr:x.ort||'',spiel:!!spiel};
  });
}
function eintrag(s,eigen,unten){return s.tr&&!s.spiel?infoZeile(s):zeile(s,eigen,unten)}
function spieltagHeute(team){
  var h=jetzt().slice(0,10);
  return team.spiele.filter(function(s){return s.d.slice(0,10)===h&&!gespielt(s)&&(!s.zeit||Date.now()<luxMs(s.d)+3*3600e3)})[0];
}
// Formkurve: die letzten fünf Spiele einer Mannschaft (älteste zuerst), true = Sieg
function formVon(name,spiele){
  return spiele.filter(function(s){return gespielt(s)&&(s.h===name||s.a===name)&&s.hs!==s.as}).sort(function(a,b){return a.d.localeCompare(b.d)})
    .map(function(s){return s.h===name?s.hs>s.as:s.as>s.hs});
}
function formHtml(f,gross){return '<span class="form'+(gross?' gross':'')+'">'+f.slice(-5).map(function(w){return '<i class="'+(w?'w':'l')+'">'+(gross?(w?t('thS'):t('thN')):'')+'</i>'}).join('')+'</span>'}
function serie(f){if(!f.length)return null;var x=f[f.length-1],n=0;for(var i=f.length-1;i>=0&&f[i]===x;i--)n++;return {sieg:x,n:n}}

/* ---------- Kopf und Leiste ---------- */
var LEISTE=[['woche','🗓️','leisteWoche'],['spiele','🏀','leisteSpiele'],['liga','📊','leisteLiga'],['team','👕','leisteTeam'],['mehr','☰','leisteMehr']];
function wocheTage(){
  var j=jetzt(), w=wtag(j), mo=tagePlus(j,-((w+6)%7));
  if(w===0&&j.slice(11)>='22:00')mo=tagePlus(mo,7);
  return {von:mo,bis:tagePlus(mo,6)};
}
function wocheSpiele(){
  var z=wocheTage(), l=[], ids={};
  if(!D)return l;
  D.teams.forEach(function(team){team.spiele.concat(trainerTermine(team)).forEach(function(s){
    var d=s.d.slice(0,10);
    if(d>=z.von&&d<=z.bis&&!ids[s.id]){ids[s.id]=1;l.push({s:s,team:team})}
  })});
  return l.sort(function(a,b){return a.s.d.localeCompare(b.s.d)});
}
function newsNeu(){var g=+lese('newsGesehen','0');return (C.news||[]).filter(function(n){return n.datum>g}).length}
function kopfBauen(){
  var team=TEAM[TK], mitTeam=ANSICHT==='spiele'||ANSICHT==='liga'||ANSICHT==='team';
  document.getElementById('unter').textContent=(mitTeam?team.reiter:ANSICHT==='woche'?t('woche'):t('leisteMehr'))+' · '+(D.saison||'');

function spieleHtml(team){
  var k=team.klasse, eigen=team.n, h='', sp=team.spiele;
  if(!sp.length&&!trainerTermine(team).length)return karte(esc(team.reiter),'','<p class="leer">'+t('keineDaten')+'</p>'+aboHtml(team));
  var st=spieltagHeute(team);
  if(st){
    var b=luxMs(st.d), min=Math.ceil((b-Date.now())/6e4), gegner=st.h===eigen?st.a:st.h, heim=st.h===eigen;
    var kopf= !st.zeit?t('spieltag'): min<=0?t('laeuft'): min<=15?t('gleichLos'):t('spieltag');

    if(min<=0)h+='<a class="knopf hell" href="'+LIVE_FLBB+'" target="_blank" rel="noopener">'+t('flbbLive')+'</a><div class="klein" style="color:#f3d6da;margin-top:6px">'+t('ytHin')+'</div>';

/* ---------- Statistik (anonym, nur mit Worker) ---------- */
function zaehle(q){if(!WORKER_URL)return;try{fetch(WORKER_URL+'?'+q,{mode:'no-cors',keepalive:true}).catch(function(){})}catch(e){}}
function zaehleOeffnung(){
  var tag=jetzt().slice(0,10), neu=lese('gezaehlt','')!==tag, erst=lese('erst','')==='';
  merke('gezaehlt',tag);if(erst)merke('erst','1');
  var art=(navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'app':'web';
  zaehle('zaehle=1&neu='+(neu?1:0)+'&erst='+(erst?1:0)+'&art='+art+'&reiter='+encodeURIComponent(ANSICHT==='woche'||ANSICHT==='mehr'?ANSICHT:TEAM[TK].reiter));
}

/* ---------- Mitteilungen (Web-Push über den Worker) ---------- */
var ARTEN=[['heute','aHeute'],['ergebnis','aErg'],['uhrzeit','aZeit'],['neu','aNeu'],['trainer','aTrainer'],['news','aNews']];
var kannPush='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
var istIos=/iP(hone|ad|od)/.test(navigator.userAgent), istApp=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function wahlLesen(){try{return JSON.parse(lese('wahl','null'))}catch(e){return null}}
function abo(){return navigator.serviceWorker.getRegistration('./').then(function(r){return r?r.pushManager.getSubscription():null})}
function mittBauen(){
  var m=document.getElementById('mittPlatz');if(!m)return;
  var w=wahlLesen()||{teams:[TK],arten:['heute','ergebnis','uhrzeit','trainer','news']};
  var h='<p>'+t('mText')+'</p>';
  if(!kannPush)h+='<p><b>'+(istIos&&!istApp?t('mIos'):t('mNein'))+'</b></p>';
  else{
    h+='<b>'+t('mTeams')+'</b><div class="wahl">'+D.teams.map(function(x){return '<label><input type="checkbox" name="mt" value="'+x.key+'"'+(w.teams.indexOf(x.key)>=0?' checked':'')+'>'+esc(x.reiter)+'</label>'}).join('')+'</div>'+
      '<b>'+t('mArten')+'</b><div class="wahl">'+ARTEN.map(function(a){return '<label><input type="checkbox" name="ma" value="'+a[0]+'"'+(w.arten.indexOf(a[0])>=0?' checked':'')+'>'+t(a[1])+'</label>'}).join('')+'</div>'+
      '<div id="mknoepfe"></div><p class="klein" id="mstatus"></p><p class="klein">'+t('mDatenschutz')+'</p>';
  }
  m.innerHTML=karte('🔔 '+t('mTitel'),'',h);
  if(!kannPush)return;
  abo().then(function(a){
    var k=document.getElementById('mknoepfe');if(!k)return;
    k.innerHTML=a?'<button class="knopf voll" id="mspeichern">'+t('mSpeichern')+'</button><button class="knopf hell" id="mtest">'+t('mTest')+'</button><button class="knopf hell" id="maus">'+t('mAus')+'</button>':'<button class="knopf voll" id="man">'+t('mAn')+'</button>';
    var b;
    if((b=document.getElementById('man')))b.onclick=einschalten;
    if((b=document.getElementById('mspeichern')))b.onclick=function(){wahlSenden(a).then(function(){status(t('mGespeichert'))},function(){status(t('mFehler'))})};
    if((b=document.getElementById('mtest')))b.onclick=function(){post('push','test',{endpoint:a.endpoint}).catch(function(){status(t('mFehler'))})};
    if((b=document.getElementById('maus')))b.onclick=function(){post('push','abmelden',{endpoint:a.endpoint}).catch(function(){});a.unsubscribe().then(mittBauen)};
  });
}
function status(s){var e=document.getElementById('mstatus');if(e)e.textContent=s}
function auswahl(){
  var w={teams:[].map.call(document.querySelectorAll('input[name=mt]:checked'),function(i){return i.value}),arten:[].map.call(document.querySelectorAll('input[name=ma]:checked'),function(i){return i.value})};
  merke('wahl',JSON.stringify(w));return w;
}
function post(bereich,was,body){return fetch(WORKER_URL+'?'+bereich+'='+was,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw {status:r.status,fehler:j&&j.fehler};return j})})}
function wahlSenden(a){var w=auswahl(), je={};w.teams.forEach(function(k){je[k]=w.arten});return post('push','wahl',{endpoint:a.endpoint,je:je})}
function einschalten(){
  auswahl();
  var reg;
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(r){reg=r;return Notification.requestPermission()})
  .then(function(p){if(p!=='granted')throw 'erlaubnis';return fetch(WORKER_URL+'?push=schluessel').then(function(r){return r.json()})})
  .then(function(j){var k=atob(j.schluessel.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((j.schluessel.length+3)%4));return navigator.serviceWorker.ready.then(function(){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(k,function(c){return c.charCodeAt(0)})})})})
  .then(function(a){var j=a.toJSON();return post('push','anmelden',{endpoint:j.endpoint,keys:j.keys}).then(function(){return wahlSenden(a)})})
  .then(function(){mittBauen();setTimeout(function(){status(t('mGespeichert'))},300)})
  .catch(function(e){status(e&&e.status===409?t('mVoll'):t('mFehler'))});
}

/* ---------- Trainer-Bereich (nur Deutsch; Daten beim Worker) ---------- */
var CK=lese('ck',''), ICH=null, FORM=null, PERS=null, NEUCODE=null;
var TERMIN_ARTEN=['Freundschaftsspiel','Turnier','Training abgesagt','Zusatztraining','Sonstiges'];
function cpost(was,body){body=body||{};body.k=CK;return post('coach',was,body)}
function coachBauen(){
  var el=document.getElementById('coach');if(!el)return;
  if(!CK){
    el.innerHTML='<p>Für Trainer und Vorstand: Termine (Freundschaftsspiele, Turniere, Trainingsabsagen) und News eintragen. Den Code bekommst du vom Verein.</p>'+
      '<form id="cein" class="cf"><input name="code" placeholder="Code" autocomplete="off" autocapitalize="characters" required><button class="knopf voll">Anmelden</button></form><p class="klein rot" id="cfehler"></p>';
    return;
  }
  if(!ICH){el.innerHTML='<p class="leer">…</p>';cpost('ich').then(function(j){ICH=j;coachBauen()}).catch(function(e){if(e&&e.status===401){CK='';merke('ck','')}el.innerHTML='<p class="leer">'+(e&&e.status===401?'Du bist abgemeldet.':'Keine Verbindung.')+'</p>';if(!CK)coachBauen()});return}
  var tn=function(k){return TEAM[k]?TEAM[k].reiter:k}, ver=ICH.rolle==='verwalter';
  var h='<p>Angemeldet als <b>'+esc(ICH.name)+'</b> ('+(ver?'Verwalter':'Trainer · '+ICH.teams.map(tn).join(', '))+') · <a href="#" id="cab">Abmelden</a></p>';
  if(FORM)h+=formHtml2();
  else h+='<div class="zwei"><button class="knopf voll" data-cneu="termin">+ Termin</button><button class="knopf voll" data-cneu="news">+ News</button></div>';
  h+='<h3 class="bt">Termine'+(ver?' (alle)':'')+'</h3>'+(ICH.termine.length?ICH.termine.map(function(x){
    return '<div class="ce'+(x.abgesagt?' weg':'')+'"><b>'+esc(x.art)+'</b> · '+esc(tn(x.team))+' · '+datKurz(x.datum)+(x.zeit?' '+x.zeit:'')+(x.gegner?' · '+esc(x.gegner):'')+(x.abgesagt?' · <b class="rot">abgesagt</b>':'')+
      '<div class="cek"><button data-cedit="'+x.id+'">Ändern</button>'+(x.art==='Training abgesagt'?'':'<button data-cab="'+x.id+'">'+(x.abgesagt?'Wieder ansetzen':'Absagen')+'</button>')+'<button data-cdel="'+x.id+'">Löschen</button></div></div>'}).join(''):'<p class="klein">Noch keine.</p>');
  h+='<h3 class="bt">News'+(ver?' (alle)':'')+'</h3>'+((ICH.news||[]).length?ICH.news.map(function(n){return '<div class="ce"><b>'+esc(n.titel)+'</b> · '+(n.team?esc(tn(n.team)):'Verein')+' · '+datKurz(luxZeit(n.datum))+'<div class="cek"><button data-nedit="'+n.id+'">Ändern</button><button data-ndel="'+n.id+'">Löschen</button></div></div>'}).join(''):'<p class="klein">Noch keine.</p>');
  if(ver){
    h+='<h3 class="bt">Trainer & Verwalter</h3>';
    if(NEUCODE)h+='<div class="code">Code für <b>'+esc(NEUCODE.name)+'</b>:<div class="gcode">'+esc(NEUCODE.code)+'</div><span class="klein">14 Tage gültig, nur einmal. Persönlich weitergeben (nicht in Gruppen posten). Eingeben unter Mehr → Trainer & Vorstand.</span></div>';
    if(!PERS){cpost('personen').then(function(j){PERS=j.personen;coachBauen()});h+='<p class="leer">…</p>'}
    else h+=PERS.map(function(p){return '<div class="ce'+(p.gesperrt?' weg':'')+'"><b>'+esc(p.name)+'</b> · '+(p.rolle==='verwalter'?'Verwalter':p.teams.map(tn).join(', '))+'<br><span class="klein">'+(p.gesperrt?'gesperrt':p.geraete?'✓ angemeldet ('+p.geraete+' Gerät'+(p.geraete>1?'e':'')+')':p.code_bis>Date.now()?'Code noch nicht eingelöst':'kein gültiger Code')+'</span>'+
      (p.name==='Chef'?'':'<div class="cek"><button data-pedit="'+p.id+'">Ändern</button><button data-pcode="'+p.id+'">Neuer Code</button><button data-psperr="'+p.id+'" data-wieder="'+(p.gesperrt?1:0)+'">'+(p.gesperrt?'Entsperren':'Sperren')+'</button></div>')+'</div>'}).join('');
    if(!FORM)h+='<button class="knopf hell" data-cneu="person">+ Trainer / Verwalter</button>';
  }
  h+='<p class="klein rot" id="cfehler"></p>';
  el.innerHTML=h;
}
function teamOptionen(sel,mitVerein){
  var l=ICH.rolle==='verwalter'?D.teams.map(function(x){return x.key}):ICH.teams;
  return (mitVerein&&ICH.rolle==='verwalter'?'<option value="">Ganzer Verein</option>':'')+l.filter(function(k){return TEAM[k]}).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(TEAM[k].reiter)+'</option>'}).join('');
}
function formHtml2(){
  var f=FORM, x=f.wert||{};
  if(f.art==='termin')return '<form id="cform" class="cf"><h3 class="bt">'+(x.id?'Termin ändern':'Neuer Termin')+'</h3>'+
    '<label>Mannschaft<select name="team">'+teamOptionen(x.team||TK)+'</select></label>'+
    '<label>Art<select name="art">'+TERMIN_ARTEN.map(function(a){return '<option'+(a===x.art?' selected':'')+'>'+a+'</option>'}).join('')+'</select></label>'+
    '<div class="zwei"><label>Datum<input type="date" name="datum" required value="'+esc(x.datum||'')+'"></label><label>Uhrzeit<input type="time" name="zeit" value="'+esc(x.zeit||'')+'"></label></div>'+
    '<div class="zwei"><label>Ende (frei)<input type="time" name="ende" value="'+esc(x.ende||'')+'"></label><label class="hk"><input type="checkbox" name="heim"'+(x.heim===0?'':' checked')+'> zu Hause</label></div>'+
    '<label>Gegner / Veranstalter<input name="gegner" maxlength="60" value="'+esc(x.gegner||'')+'"></label>'+
    '<label>Ort<input name="ort" maxlength="80" placeholder="z. B. Heffingen" value="'+esc(x.ort||'')+'"></label>'+
    '<label>Bemerkung<input name="bem" maxlength="200" value="'+esc(x.bem||'')+'"></label>'+
    '<p class="klein">Öffentlich sichtbar – keine Namen von Kindern, keine Telefonnummern.</p>'+
    '<div class="zwei"><button class="knopf voll">Speichern</button><button type="button" class="knopf hell" data-cabbr="1">Abbrechen</button></div></form>';
  if(f.art==='news')return '<form id="cform" class="cf"><h3 class="bt">'+(x.id?'News ändern':'Neue News')+'</h3>'+
    '<label>Für<select name="team">'+teamOptionen(x.team||'',true)+'</select></label>'+
    '<label>Titel<input name="titel" maxlength="100" required value="'+esc(x.titel||'')+'"></label>'+
    '<label>Text<textarea name="text" rows="5" maxlength="1500">'+esc(x.text||'')+'</textarea></label>'+
    '<label>Link (frei, z. B. Instagram-Beitrag)<input name="link" type="url" placeholder="https://…" value="'+esc(x.link||'')+'"></label>'+
    (x.id?'':'<label class="hk"><input type="checkbox" name="melden" checked> als Mitteilung schicken</label>')+
    '<div class="zwei"><button class="knopf voll">Veröffentlichen</button><button type="button" class="knopf hell" data-cabbr="1">Abbrechen</button></div></form>';
  return '<form id="cform" class="cf"><h3 class="bt">'+(x.id?'Person ändern':'Neuer Trainer / Verwalter')+'</h3>'+
    '<label>Name<input name="name" maxlength="40" required value="'+esc(x.name||'')+'"></label>'+
    '<label>Rolle<select name="rolle"><option value="trainer"'+(x.rolle!=='verwalter'?' selected':'')+'>Trainer (nur seine Mannschaften)</option><option value="verwalter"'+(x.rolle==='verwalter'?' selected':'')+'>Verwalter (alles)</option></select></label>'+
    '<b>Mannschaften</b><div class="wahl">'+D.teams.map(function(t2){return '<label><input type="checkbox" name="teams" value="'+t2.key+'"'+((x.teams||[]).indexOf(t2.key)>=0?' checked':'')+'>'+esc(t2.reiter)+'</label>'}).join('')+'</div>'+
    '<div class="zwei"><button class="knopf voll">'+(x.id?'Speichern':'Code erzeugen')+'</button><button type="button" class="knopf hell" data-cabbr="1">Abbrechen</button></div></form>';
}
function cfehler(e){var el=document.getElementById('cfehler');if(el)el.textContent=(e&&e.fehler)||'Hat nicht geklappt.'}
function neuLaden(){ICH=null;PERS=null;fetch(WORKER_URL+'?coach=liste&t='+Date.now()).then(function(r){return r.json()}).then(function(j){C=j;bauen()}).catch(function(){bauen()})}
document.addEventListener('submit',function(e){
  var f=e.target;if(f.id!=='cein'&&f.id!=='cform')return;
  e.preventDefault();
  var v=function(n){var el=f.elements[n];return el?(el.type==='checkbox'?el.checked:el.value.trim()):undefined};
  if(f.id==='cein'){post('coach','einloesen',{code:v('code')}).then(function(j){CK=j.k;merke('ck',CK);ICH=null;coachBauen()}).catch(cfehler);return}
  var x=FORM.wert||{}, p;
  if(FORM.art==='termin')p=cpost('termin',{reiter:TEAM[v('team')]?TEAM[v('team')].reiter:'',t:{id:x.id,team:v('team'),art:v('art'),datum:v('datum'),zeit:v('zeit')||null,ende:v('ende')||null,heim:v('heim'),gegner:v('gegner'),ort:v('ort'),bem:v('bem'),abgesagt:!!x.abgesagt}});
  else if(FORM.art==='news')p=cpost('news',{melden:v('melden')!==false,n:{id:x.id,team:v('team')||null,titel:v('titel'),text:f.elements.text.value,link:v('link')}});
  else p=cpost('person',{p:{id:x.id,name:v('name'),rolle:v('rolle'),teams:[].map.call(f.querySelectorAll('input[name=teams]:checked'),function(i){return i.value})}}).then(function(j){if(j.code)NEUCODE={name:v('name'),code:j.code};return j});
  p.then(function(){FORM=null;neuLaden()}).catch(cfehler);
});
document.addEventListener('click',function(e){
  var b=e.target.closest('#coach button, #coach a');if(!b)return;
  var a=function(n){return b.getAttribute(n)};
  if(b.id==='cab'){e.preventDefault();cpost('abmelden').catch(function(){});CK='';ICH=null;merke('ck','');coachBauen();return}
  if(a('data-cneu')){FORM={art:a('data-cneu')};NEUCODE=null;coachBauen();return}
  if(a('data-cabbr')){FORM=null;coachBauen();return}
  var termin=function(id){return ICH.termine.filter(function(x){return String(x.id)===id})[0]};
  if(a('data-cedit')){FORM={art:'termin',wert:termin(a('data-cedit'))};coachBauen();document.getElementById('coach').scrollIntoView();return}
  if(a('data-cab')){var x=termin(a('data-cab'));cpost('termin',{reiter:TEAM[x.team]?TEAM[x.team].reiter:'',t:Object.assign({},x,{heim:!!x.heim,abgesagt:!x.abgesagt})}).then(neuLaden).catch(cfehler);return}
  if(a('data-cdel')){if(b.textContent!=='Wirklich?'){b.textContent='Wirklich?';return}cpost('terminLoeschen',{id:+a('data-cdel')}).then(neuLaden).catch(cfehler);return}
  if(a('data-nedit')){FORM={art:'news',wert:ICH.news.filter(function(n){return String(n.id)===a('data-nedit')})[0]};coachBauen();return}
  if(a('data-ndel')){if(b.textContent!=='Wirklich?'){b.textContent='Wirklich?';return}cpost('newsLoeschen',{id:+a('data-ndel')}).then(neuLaden).catch(cfehler);return}
  var person=function(id){return PERS.filter(function(p){return String(p.id)===id})[0]};
  if(a('data-pedit')){FORM={art:'person',wert:person(a('data-pedit'))};coachBauen();return}
  if(a('data-pcode')){var p=person(a('data-pcode'));cpost('person',{p:p,neuerCode:true}).then(function(j){NEUCODE={name:p.name,code:j.code};PERS=null;coachBauen()}).catch(cfehler);return}
  if(a('data-psperr')){cpost('sperren',{id:+a('data-psperr'),wieder:a('data-wieder')==='1'}).then(function(){PERS=null;coachBauen()}).catch(cfehler);return}
});

laden().then(function(){zaehleOeffnung()});
})();
</script>
</body>
</html>
