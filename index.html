<title>US Heffingen</title>
<meta name="description" content="Spiele, Ergebnisse und Tabellen aller Mannschaften der BBC US Heffingen.">
<meta name="theme-color" content="#140a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Aufbau wie die App des FC Koeppchen: dunkler Kopf mit Reitern, darunter Karten.
   Vereinsfarben der US Heffingen: Bordeaux #8F0311 und Gold #FDAB1A. */
:root{
  --bg:#f3f1f1; --karte:#fff; --ink:#161012; --grau:#6b6264; --linie:#e6dfe0;
  --akzent:#8F0311; --akzentHell:#fbeef0; --gold:#FDAB1A; --kopf:#140a0c; --orange:#b4540a; --rot:#d4102a;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
button{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* Kopf */
#kopf{background:var(--kopf);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 14px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 12px}
#logo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.top h1{margin:0;font-size:28px;line-height:1.05;letter-spacing:.05em;font-weight:800}
#unter{font-size:14px;color:#cdbfc2;margin-top:1px}
#zahnrad{margin-left:auto;background:none;border:0;font-size:28px;padding:4px;cursor:pointer}
.seg{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #3a2a2d;border-radius:12px;overflow:hidden;background:#1e1214}
.seg button{background:none;border:0;border-right:1px solid #3a2a2d;border-bottom:1px solid #3a2a2d;color:#d9cfd1;font-weight:700;font-size:15px;padding:9px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:nth-child(4n+1){border-right:0}
.seg button.woche{grid-column:1/-1;border-right:0;background:#fff;color:#2b1d20;text-transform:uppercase;letter-spacing:.06em;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px}
.seg button.woche img{width:22px;height:22px;border-radius:50%}
.seg button.an{background:#fff;color:#000}
.seg button.woche.an{background:var(--gold);color:#1a0f00}
.seg button .live{color:#ff5a6e}
@media (min-width:600px){
  .seg{grid-template-columns:repeat(6,1fr)}
  .seg button:nth-child(4n+1){border-right:1px solid #3a2a2d}
  .seg button:nth-child(6n+1){border-right:0}
}
.goldlinie{height:6px;background:linear-gradient(90deg,var(--gold),#ffc95a 50%,var(--gold))}

/* Inhalt */
main{max-width:760px;margin:0 auto;padding:16px 12px 8px}
.karte{background:var(--karte);border:2px solid var(--akzent);border-radius:18px;margin:0 0 18px;overflow:hidden}
.kk{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--akzentHell);border-bottom:1px solid #efd4d8;padding:11px 16px}
.kk h2{margin:0;font-size:21px;letter-spacing:.04em;font-weight:800}
.kk .neben{color:var(--grau);font-size:14px;text-align:right}
.kk.voll{background:var(--akzent);color:#fff;border-bottom:0}
.kk.voll .pill{background:#fff;color:var(--akzent)}
.kb{padding:12px 16px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#efe9ea;color:#4a3f41}
.klein{font-size:13px;color:var(--grau)}
.mitte{text-align:center}

/* Spielzeile: Heim [Stand] Gast */
.sp{padding:10px 0;border-bottom:1px solid var(--linie)}
.sp:last-child{border-bottom:0}
.sz{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sz .h{text-align:right}
.sz .wir{font-weight:800}
.stand{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;border-radius:9px;padding:3px 8px;color:#fff;background:#151012;letter-spacing:.03em}
.stand.sieg{background:var(--akzent)}
.stand.neutral{background:#e9e4e5;color:#222}
.stand.offen{background:#f1eeee;color:#7a7072;font-size:14px;font-weight:700;border:1px solid #e2dcdd;min-width:64px;padding:4px 8px;border-radius:999px}
.sd{text-align:center;font-size:13px;color:var(--grau);margin-top:4px}
.datumkopf{font-size:24px;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.datumkopf small{font-family:Georgia,serif;font-size:15px;color:var(--grau)}
.tag{color:var(--akzent);font-weight:800;border-bottom:2px solid var(--akzent);padding:10px 0 4px;margin-top:6px}
.wteam{background:var(--akzent);color:#fff;font-size:14px;padding:2px 11px}
.gleich{color:var(--orange);font-weight:700}
.ort a{text-decoration:none}

/* Letztes Spiel */
.gross{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:8px 0}
.gross .t{text-align:center;font-size:15px}
.gross .t.wir{font-weight:800}
.gross .erg{font-size:48px;font-weight:300;letter-spacing:.02em;color:var(--akzent);font-variant-numeric:tabular-nums;white-space:nowrap}
.gross .erg.nl{color:#151012}
.logo{width:58px;height:58px;border-radius:50%;object-fit:contain;display:block;margin:0 auto 6px;background:#fff}
.ini{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:#efe9ea;color:#5a4e50;font-weight:800;font-size:18px;letter-spacing:.03em}
.knopf{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer;margin:10px 0 4px}
.knopf.voll{background:var(--akzent);color:#fff}
.knopf.rot{background:var(--rot);color:#fff;border-radius:999px}
.knopf.hell{background:#fff;border:2px solid var(--akzent);color:var(--akzent)}
details.hilfe{margin:6px 0 2px;text-align:center}
details.hilfe summary{color:var(--akzent);font-weight:700;cursor:pointer;font-size:15px;list-style:none}
details.hilfe summary::before{content:"▸ "}
details.hilfe[open] summary::before{content:"▾ "}
details.hilfe div{text-align:left;font-size:14px;color:#3d3436;background:#faf7f7;border-radius:10px;padding:10px 12px;margin-top:6px}
code{font-size:12px;word-break:break-all;background:#efe9ea;padding:1px 4px;border-radius:4px}

/* Spieltag-Kasten */
.heute{background:linear-gradient(135deg,var(--akzent),#5b0009);color:#fff;border-radius:18px;padding:16px;margin:0 0 18px;text-align:center}
.heute b.g{display:block;font-size:24px;letter-spacing:.02em}
.heute .z{font-size:17px;margin-top:6px}
.heute .knopf{margin-top:12px}
.heute .knopf.hell{border-color:#fff;color:#fff;background:transparent}
.heute .knopf.weiss{background:#fff;color:var(--akzent)}

/* Tabelle */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--grau);font-weight:700;text-align:right;padding:4px 4px;border-bottom:1px solid var(--linie)}
th.l,td.l{text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--linie);text-align:right;font-size:15px}
td.pl{font-weight:800;width:28px}
td.n{text-align:left;width:100%}
td.n span{display:inline-flex;align-items:center;gap:8px}
td.n img,td.n i{width:22px;height:22px;border-radius:50%;object-fit:contain;flex:none}
td.n i{display:inline-flex;align-items:center;justify-content:center;background:#efe9ea;font-style:normal;font-size:9px;font-weight:800;color:#6a5e60}
td.pkt{font-weight:800}
tr.wir td{background:var(--akzentHell);font-weight:800}
tr:last-child td{border-bottom:0}

/* Willkommen */
.sprache{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.sprache button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:3px 10px;font-weight:700;cursor:pointer}
.sprache button.an{border:2px solid var(--akzent);color:var(--akzent)}
.welcome h3{margin:4px 0 8px;font-size:21px}
.welcome ul{padding-left:20px;margin:6px 0}
.welcome li{margin:4px 0}

/* Mitteilungen */
#mitt{max-width:760px;margin:16px auto 0;padding:0 12px}
.wahl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin:8px 0}
.wahl label{display:flex;align-items:center;gap:8px;font-size:15px}
.wahl input{width:20px;height:20px;accent-color:var(--akzent)}

footer{max-width:760px;margin:0 auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--grau);font-size:13px}
footer .knopf{max-width:320px;margin:10px auto}
footer .sprache{justify-content:center;margin:10px 0}
.leer{color:var(--grau);text-align:center;padding:14px 4px}
</style>
</head>

</header>

function datKurz(d){return TAGE[L][wtag(d)]+', '+(+d.slice(8,10))+'.'+(+d.slice(5,7))+'.'}
function uhr(s){return s.zeit?s.d.slice(11,16):t('uhrOffen')}
function tagePlus(d,n){var x=new Date(d.slice(0,10)+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function tageBis(d){var a=Date.parse(jetzt().slice(0,10)+'T12:00:00Z'),b=Date.parse(d.slice(0,10)+'T12:00:00Z');return Math.round((b-a)/864e5)}
function abstand(d){var n=tageBis(d);return n===0?t('heute'):n===1?t('morgen'):n>1?t('inTagen',{n:n}):''}
function istWir(n){return /^US Heffingen( [A-F])?$/.test(n)}
function gespielt(s){return s.hs!=null&&s.as!=null}
function ini(n){return n.replace(/^(US|AB|BC|BBC|AS|T71|CFBB)\s/,'').split(/\s+/).map(function(w){return w[0]}).join('').slice(0,3).toUpperCase()}

/* ---------- Daten ---------- */
var D=null, TEAM={}, REITER=lese('reiter','woche'), offenAlle={};
// ?r=<mannschaft> (aus einer Mitteilung) öffnet diesen Reiter
(function(){var r=new URLSearchParams(location.search).get('r');if(r){REITER=r;merke('reiter',r);history.replaceState(null,'',location.pathname)}})();
function laden(){
  return fetch('data/heffingen.json?'+Math.floor(Date.now()/6e4),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .catch(function(){return window.SEED||null})
    .then(function(d){if(!d)return;D=d;TEAM={};D.teams.forEach(function(x){TEAM[x.key]=x});if(REITER!=='woche'&&!TEAM[REITER])REITER='woche';bauen()});
}
function logoHtml(name,k){
  if(istWir(name))return '<img class="logo" src="icon-192.png" alt="">';
  var c=k&&k.logos&&k.logos[name];
  if(c)return '<img class="logo" src="'+LOGO_FLBB+esc(c)+'.jpg" alt="" onerror="this.outerHTML=\'<div class=ini>'+esc(ini(name))+'</div>\'">';
  return '<div class="ini">'+esc(ini(name))+'</div>';
}
function miniLogo(name,k){
  if(istWir(name))return '<img src="icon-192.png" alt="">';
  var c=k&&k.logos&&k.logos[name];
  return c?'<img src="'+LOGO_FLBB+esc(c)+'.jpg" alt="" onerror="this.outerHTML=\'<i>'+esc(ini(name))+'</i>\'">':'<i>'+esc(ini(name))+'</i>';
}
function karte(titel,neben,inhalt,voll){return '<section class="karte"><div class="kk'+(voll?' voll':'')+'"><h2>'+titel+'</h2>'+(neben?'<div class="neben">'+neben+'</div>':'')+'</div><div class="kb">'+inhalt+'</div></section>'}
function wettText(s){return s.pokal?t('pokal')+(s.runde?' · '+s.runde:''):(s.wett||'')}
function ortHtml(s){
  if(!s.ort)return '';
  var u=s.nav||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.adr||s.ort));
  return '<span class="ort">📍 <a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(s.ort)+'</a></span>';
}
function standHtml(s,eigen){
  if(!gespielt(s))return '<span class="stand offen">'+(laeuftJetzt(s)?t('laeuftK'):t('offen'))+'</span>';
  var wirH=eigen?s.h===eigen:istWir(s.h), wirA=eigen?s.a===eigen:istWir(s.a), cls='';
  if(wirH||wirA){var sieg=wirH?s.hs>s.as:s.as>s.hs;cls=sieg?' sieg':''}else cls=' neutral';
  return '<span class="stand'+cls+'">'+s.hs+' : '+s.as+'</span>';
}
function zeile(s,eigen,unten){
  var w=function(n){return (eigen?n===eigen:istWir(n))?' wir':''};
  return '<div class="sp"><div class="sz"><div class="h'+w(s.h)+'">'+esc(s.h)+'</div>'+standHtml(s,eigen)+'<div class="a'+w(s.a)+'">'+esc(s.a)+'</div></div>'+(unten?'<div class="sd">'+unten+'</div>':'')+'</div>';
}
function laeuftJetzt(s){var b=luxMs(s.d),n=Date.now();return s.zeit&&!gespielt(s)&&n>=b&&n<b+3*3600e3}
function spieltagHeute(team){
  var h=jetzt().slice(0,10);
  return team.spiele.filter(function(s){return s.d.slice(0,10)===h&&!gespielt(s)&&(!s.zeit||Date.now()<luxMs(s.d)+3*3600e3)})[0];
}

/* ---------- Reiter ---------- */
function wocheTage(){
  var j=jetzt(), w=wtag(j), mo=tagePlus(j,-((w+6)%7));
  if(w===0&&j.slice(11)>='22:00')mo=tagePlus(mo,7);
  return {von:mo,bis:tagePlus(mo,6)};
}
function wocheSpiele(){
  var z=wocheTage(), l=[], ids={};
  if(!D)return l;
  D.teams.forEach(function(team){team.spiele.forEach(function(s){
    var d=s.d.slice(0,10);
    if(d>=z.von&&d<=z.bis&&!ids[s.id]){ids[s.id]=1;l.push({s:s,team:team})}
  })});
  return l.sort(function(a,b){return a.s.d.localeCompare(b.s.d)});
}
function reiterBauen(){
  var ws=wocheSpiele(), heute=jetzt().slice(0,10), nh=ws.filter(function(x){return x.s.d.slice(0,10)===heute}).length;
  var nl=ws.filter(function(x){return laeuftJetzt(x.s)}).length;
  var info=nl?' · <span class="live">🔴 '+nl+' '+(nl===1?t('spiel1'):t('spieleN'))+' '+t('liveN')+'</span>':nh?' · '+t('heuteN')+' '+nh+' '+(nh===1?t('spiel1'):t('spieleN')):' · '+ws.length+' '+(ws.length===1?t('spiel1'):t('spieleN'));
  var h='<button class="woche'+(REITER==='woche'?' an':'')+'" data-r="woche"><img src="icon-192.png" alt=""><span>'+t('woche')+info+'</span><img src="icon-192.png" alt=""></button>';
  D.teams.forEach(function(x){h+='<button class="'+(REITER===x.key?'an':'')+'" data-r="'+x.key+'">'+esc(x.reiter)+'</button>'});
  var nav=document.getElementById('reiter');nav.innerHTML=h;
}

/* ---------- Mannschaft ---------- */
function teamHtml(team){
  var k=team.klasse, eigen=team.n, h='';
  var sp=team.spiele;
  if(!sp.length)return karte(esc(team.reiter),'','<p class="leer">'+t('keineDaten')+'</p>'+aboHtml(team));
  // Spieltag-Kasten
  var st=spieltagHeute(team);
  if(st){
    var b=luxMs(st.d), min=Math.ceil((b-Date.now())/6e4), gegner=st.h===eigen?st.a:st.h, heim=st.h===eigen;
    var kopf= !st.zeit?t('spieltag'): min<=0?t('laeuft'): min<=15?t('gleichLos'):t('spieltag');
    var z= st.zeit&&min>0&&min<=15?t('inMin',{n:min}):st.zeit&&min>0?t('beginn')+' '+uhr(st):'';
    h+='<div class="heute"><b class="g">'+kopf+'</b><div class="z">'+(z?esc(z)+'<br>':'')+(heim?'🏠 ':'✈️ ')+'vs <b>'+esc(gegner)+'</b></div><div class="z klein" style="color:#f3d6da">'+(st.ort?'📍 '+esc(st.ort):'')+(st.wett?' · '+esc(wettText(st)):'')+'</div>';
    if(team.live)h+='<a class="knopf weiss" href="'+esc(team.live)+'" target="_blank" rel="noopener">'+t('yt')+'</a>';
    if(min<=0)h+='<a class="knopf hell" href="'+LIVE_FLBB+'" target="_blank" rel="noopener">'+t('flbbLive')+'</a><div class="klein" style="color:#f3d6da;margin-top:6px">'+t('ytHin')+'</div>';
    h+='</div>';
  }
  // Letztes Spiel
  var gesp=sp.filter(gespielt), letzt=gesp[gesp.length-1];
  if(letzt){
    var wirH=letzt.h===eigen, sieg=wirH?letzt.hs>letzt.as:letzt.as>letzt.hs, pl=!letzt.pokal&&k&&k.tabelle?(k.tabelle.filter(function(z){return z.n===eigen})[0]||{}).pl:null;
    var g='<div class="mitte" style="font-size:21px">'+datKurz(letzt.d)+(letzt.runde&&!letzt.pokal?'':'')+'</div>'+
      '<div class="gross"><div class="t'+(wirH?' wir':'')+'">'+logoHtml(letzt.h,k)+esc(letzt.h)+'</div><div class="erg'+(sieg?'':' nl')+'">'+letzt.hs+':'+letzt.as+'</div><div class="t'+(wirH?'':' wir')+'">'+logoHtml(letzt.a,k)+esc(letzt.a)+'</div></div>'+
      '<div class="mitte klein" style="color:#333;font-size:15px">'+esc(wettText(letzt))+(pl?' · '+t('jetztPlatz',{n:'<b>'+pl+'</b>'}).replace('{n}',pl):'')+'</div>';
    if(team.live)g+='<a class="knopf rot" href="'+YT_KANAL+'" target="_blank" rel="noopener">'+t('ytAlt')+'</a>';
    h+=karte(t('letztes'),'<span class="pill">'+t('endstand')+'</span>',g,true);
  }
  // Nächste Spiele
  var kommend=sp.filter(function(s){return !gespielt(s)&&s.d.slice(0,10)>=jetzt().slice(0,10)});
  if(kommend.length){
    var n=kommend.slice(0,5), g2='';
    n.forEach(function(s,i){
      if(i===0)g2+='<div class="datumkopf">'+datKurz(s.d)+' · '+uhr(s)+' <small>'+abstand(s.d)+'</small></div>'+zeile(s,eigen,[ortHtml(s),esc(wettText(s))].filter(Boolean).join('<br>'));
      else g2+=zeile(s,eigen,[datKurz(s.d)+' · '+uhr(s),ortHtml(s),s.pokal?esc(wettText(s)):''].filter(Boolean).join(' · '));
    });
    if(kommend.length>5)g2+='<p class="mitte klein">'+t('weitere',{n:kommend.length-5})+'</p>';
    g2+=aboHtml(team);
    h+=karte(t('naechste'),'',g2);
  } else h+=karte(t('naechste'),'',aboHtml(team));
  // Tabelle
  if(k&&k.tabelle&&k.tabelle.length){
    var tb='<table><tr><th>#</th><th class="l">'+t('thTeam')+'</th><th>'+t('thSp')+'</th><th>'+t('thS')+'</th><th>'+t('thN')+'</th><th>±</th><th>'+t('thPkt')+'</th></tr>';
    k.tabelle.forEach(function(z){var d=z.pf-z.pa;tb+='<tr'+(z.n===eigen?' class="wir"':'')+'><td class="pl l">'+z.pl+'</td><td class="n"><span>'+miniLogo(z.n,k)+esc(z.n)+'</span></td><td>'+z.sp+'</td><td>'+z.s+'</td><td>'+z.nl+'</td><td>'+(d>0?'+':'')+d+'</td><td class="pkt">'+z.pkt+'</td></tr>'});
    tb+='</table>';
    if(k.quelle!=='FLBB')tb+='<p class="klein">'+t('berechnet')+(k.unvollstaendig?' '+t('unvollst'):'')+'</p>';
    h+=karte(t('tabelle'),esc(k.n+(k.runde?' · '+k.runde:'')),tb);
  }
  // Ergebnisse
  if(gesp.length){
    var e='';gesp.slice().reverse().forEach(function(s){e+=zeile(s,eigen,datKurz(s.d)+(s.pokal?' · '+esc(wettText(s)):''))});
    h+=karte(t('ergebnisse'),'',e);
  }
  // Alle Spiele der Klasse
  if(k&&k.spiele&&k.spiele.length){
    var auf=!!offenAlle[team.key], a='';
    if(auf){var tag='';k.spiele.forEach(function(s){var d=s.d.slice(0,10);if(d!==tag){tag=d;a+='<div class="tag">'+datKurz(s.d)+'</div>'}a+=zeile(s,eigen,(gespielt(s)?'':uhr(s)+(s.ort?' · ':''))+(gespielt(s)?'':ortHtml(s)))})}
    a+='<button class="knopf hell" data-alle="'+team.key+'">'+(auf?t('zuklappen'):t('anzeigen'))+'</button>';
    h+=karte(t('alle'),esc(k.spiele.length+' '+t('spieleN')),a);
  }
  return h;
}
function aboHtml(team){
  var u='webcal://'+ICS_FLBB+team.ics+'.ics';
  return '<a class="knopf voll" href="'+u+'">'+esc(t('abo',{t:team.reiter}))+'</a><details class="hilfe"><summary>'+t('klappt')+'</summary><div>'+t('aboHilfe')+'<br><code>https://'+ICS_FLBB+team.ics+'.ics</code></div></details>';
}

/* ---------- Unsere Woche ---------- */
function wocheHtml(){
  var z=wocheTage(), l=wocheSpiele(), h='';
  var heim=l.filter(function(x){return istWir(x.s.h)}).length;
  var fertig=l.filter(function(x){return gespielt(x.s)}), s=0, n=0;
  fertig.forEach(function(x){var wirH=istWir(x.s.h);(wirH?x.s.hs>x.s.as:x.s.as>x.s.hs)?s++:n++});
  var kopf='<div style="display:flex;align-items:center;gap:14px"><img src="icon-192.png" alt="" style="width:64px;height:64px;border-radius:50%"><div><b style="font-size:18px">'+(l.length?t('davonHeim',{n:l.length,s:l.length===1?t('spiel1'):t('spieleN'),m:heim}):t('keineWoche'))+'</b>'+(fertig.length&&fertig.length===l.length&&l.length?'<br>'+t('bilanz',{s:s,n:n}):fertig.length?'<br><span class="klein">'+t('bilanz',{s:s,n:n})+'</span>':'')+'</div></div>';
  h+=karte(t('woche'),(+z.von.slice(8,10))+'.'+(+z.von.slice(5,7))+'. – '+(+z.bis.slice(8,10))+'.'+(+z.bis.slice(5,7))+'.',kopf);
  var tage={};l.forEach(function(x){var d=x.s.d.slice(0,10);(tage[d]=tage[d]||[]).push(x)});
  Object.keys(tage).sort().forEach(function(d){
    var g='';
    tage[d].forEach(function(x){
      var s=x.s, heimS=istWir(s.h)&&s.h===x.team.n;
      var mit=tage[d].filter(function(y){return y!==x&&y.s.zeit&&s.zeit&&Math.abs(luxMs(y.s.d)-luxMs(s.d))<90*6e4&&y.s.ort!==s.ort}).map(function(y){return y.team.reiter});
      var info='<span class="pill wteam">'+esc(x.team.reiter)+'</span> · '+(istWir(s.h)?'🏠':'✈️')+' · '+(laeuftJetzt(s)?'<b style="color:var(--rot)">🔴 '+t('laeuftK')+'</b>':uhr(s))+(!gespielt(s)&&s.ort?' · '+ortHtml(s):'')+(s.pokal?' · '+esc(t('pokal')):'')+(mit.length&&!gespielt(s)?' · <span class="gleich">'+esc(t('gleichz',{t:mit.join(', ')}))+'</span>':'');
      g+='<div data-gehe="'+x.team.key+'" style="cursor:pointer">'+zeile(s,x.team.n,info)+'</div>';
    });
    var tl=TAGE_L[L][wtag(d)];
    h+=karte(tl.charAt(0).toUpperCase()+tl.slice(1)+', '+(+d.slice(8,10))+'.'+(+d.slice(5,7))+'.',d===jetzt().slice(0,10)?'<span class="pill">'+t('heute')+'</span>':'',g);
  });
  return h;
}

function spracheHtml(){return '<div class="sprache">'+['🇩🇪 DE','🇫🇷 FR','🇬🇧 EN'].map(function(x,i){return '<button data-l="'+i+'" class="'+(i===L?'an':'')+'">'+x+'</button>'}).join('')+'</div>'}
function willkommenHtml(){
  return '<section class="karte welcome"><div class="kb">'+spracheHtml()+'<div style="display:flex;align-items:center;gap:14px"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:50%"><h3>'+t('willk')+'</h3></div>'+
    '<p>'+t('w1')+'</p><b>'+t('wSo')+'</b><ul><li>'+t('wl1')+'</li><li>'+t('wl2')+'</li><li>'+t('wl3')+'</li><li>'+t('wl4')+'</li><li>'+t('wl5')+'</li><li>'+t('wl6')+'</li></ul><p>'+t('wEnde')+'</p>'+

/* ---------- Bauen ---------- */
function bauen(){
  if(!D)return;
  reiterBauen();
  var team=TEAM[REITER];
  document.getElementById('unter').textContent=(team?team.reiter:t('woche'))+' · '+(D.saison||'');
  var h='';
  if(lese('willkommen','0')!=='1')h+=willkommenHtml();
  h+=team?teamHtml(team):wocheHtml();
  document.getElementById('main').innerHTML=h;
  document.getElementById('fuss').innerHTML=fussHtml();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-r]');
  if(b){var r=b.getAttribute('data-r');if(r!==REITER){REITER=r;merke('reiter',r);zaehle('angesehen=1&reiter='+encodeURIComponent(TEAM[r]?TEAM[r].reiter:'Woche'))}bauen();window.scrollTo(0,0);return}
  var g=e.target.closest('[data-gehe]');
  if(g&&!e.target.closest('a')){REITER=g.getAttribute('data-gehe');merke('reiter',REITER);bauen();window.scrollTo(0,0);return}
  var a=e.target.closest('[data-alle]');
  if(a){var k=a.getAttribute('data-alle');offenAlle[k]=!offenAlle[k];bauen();return}
  var l=e.target.closest('[data-l]');
  if(l){L=+l.getAttribute('data-l');merke('sprache',LANGS[L]);document.documentElement.lang=LANGS[L];bauen();if(!document.getElementById('mitt').hidden)mittBauen();return}
  if(e.target.id==='los'){merke('willkommen','1');bauen();window.scrollTo(0,0);return}
  if(e.target.id==='teilen'){
    var d={title:'US Heffingen',text:t('teilenText'),url:APP_URL};
    if(navigator.share)navigator.share(d).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(APP_URL).then(function(){e.target.textContent=t('kopiert')});
  }
});
window.addEventListener('resize',function(){if(D)reiterBauen()});

setInterval(function(){var j=jetzt();if(j!==letzterBau){letzterBau=j;var offen=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('details');if(!offen)bauen()}},10e3);

/* ---------- Mitteilungen (Web-Push über den Worker) ---------- */
var ARTEN=[['heute','aHeute'],['ergebnis','aErg'],['uhrzeit','aZeit'],['neu','aNeu']];
var kannPush='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
var istIos=/iP(hone|ad|od)/.test(navigator.userAgent), istApp=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
if(WORKER_URL)document.getElementById('zahnrad').hidden=false;
document.getElementById('zahnrad').addEventListener('click',function(){var m=document.getElementById('mitt');m.hidden=!m.hidden;if(!m.hidden){mittBauen();window.scrollTo(0,0)}});
function wahlLesen(){try{return JSON.parse(lese('wahl','null'))}catch(e){return null}}
function abo(){return navigator.serviceWorker.getRegistration('./').then(function(r){return r?r.pushManager.getSubscription():null})}
function mittBauen(){
  var m=document.getElementById('mitt'), w=wahlLesen()||{teams:[],arten:['heute','ergebnis','uhrzeit']};
  var h='<p>'+t('mText')+'</p>';
  if(!kannPush)h+='<p><b>'+(istIos&&!istApp?t('mIos'):t('mNein'))+'</b></p>';
  else{
    h+='<b>'+t('mTeams')+'</b><div class="wahl">'+D.teams.map(function(x){return '<label><input type="checkbox" name="mt" value="'+x.key+'"'+(w.teams.indexOf(x.key)>=0?' checked':'')+'>'+esc(x.reiter)+'</label>'}).join('')+'</div>'+
      '<b>'+t('mArten')+'</b><div class="wahl">'+ARTEN.map(function(a){return '<label><input type="checkbox" name="ma" value="'+a[0]+'"'+(w.arten.indexOf(a[0])>=0?' checked':'')+'>'+t(a[1])+'</label>'}).join('')+'</div>'+
      '<div id="mknoepfe"></div><p class="klein" id="mstatus"></p><p class="klein">'+t('mDatenschutz')+'</p>';
  }
  h+='<button class="knopf hell" id="mzu">'+t('schliessen')+'</button>';
  m.innerHTML=karte(t('mTitel'),'',h);
  document.getElementById('mzu').onclick=function(){m.hidden=true};
  if(!kannPush)return;
  abo().then(function(a){
    var k=document.getElementById('mknoepfe');
    k.innerHTML=a?'<button class="knopf voll" id="mspeichern">'+t('mSpeichern')+'</button><button class="knopf hell" id="mtest">'+t('mTest')+'</button><button class="knopf hell" id="maus">'+t('mAus')+'</button>':'<button class="knopf voll" id="man">'+t('mAn')+'</button>';
    var b;
    if((b=document.getElementById('man')))b.onclick=einschalten;
