<html lang="en">

<title>US Heffingen</title>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first club app. Slim wordmark header, one scrolling view per tab, fixed bottom tab bar.
   The next game is the single loud block (court blue); everything else stays quiet. */
/* Farben aus dem Vereinslogo: Bordeaux #8F0311 und Gold #FDAB1A */
:root{
  --bg:#F5F1F1; --surface:#FFFFFF; --ink:#1E1416; --muted:#6A5A5E; --line:#E4D8DA; --soft:#EFE5E7;
  --accent:#8F0311; --accent-ink:#FFFFFF; --gold:#FDAB1A;
  --court:#4A5568; --win:#1B7F4B; --loss:#B42318; --solid-ink:#FFFFFF;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
    --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
    --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
    --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1C20; --surface:#3A2A30; --ink:#F6EEEF; --muted:#D3C3C7; --line:#55434A; --soft:#47353C;
  --accent:#FDAB1A; --accent-ink:#2A1700; --gold:#FDAB1A;
  --court:#A9B5C7; --win:#4CC38A; --loss:#FF7A70; --solid-ink:#0F0809;
  --hero-bg:#8F0311; --hero-ink:#FFFFFF; --hero-sub:#F6D3D8; --hero-accent:#FDAB1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px; margin:0 auto; padding-block:10px 104px}
button{font-family:inherit}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:6px 14px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{flex:none; display:block; border-radius:50%}
.brand b{display:block; font:700 27px/1 var(--f-display); letter-spacing:.05em; text-transform:uppercase}
.brand small{display:block; font:500 12px/1.2 var(--f-body); color:var(--muted); letter-spacing:.04em; margin-top:3px}
.sample{font:600 11px var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:4px 9px; border-radius:999px; white-space:nowrap}

/* structure */
.view{display:grid; gap:14px; align-content:start}
h2.sec{font:600 13px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:10px 0 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.note{margin:0; font-size:13px; color:var(--muted); padding:10px 12px; border:1px dashed var(--line); border-radius:10px}
.empty b{display:block; font:600 20px/1.2 var(--f-display); letter-spacing:.01em}
.empty p{margin:6px 0 0; color:var(--muted)}
.chip{display:inline-block; font:600 11px/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--muted); padding:3px 6px; border-radius:6px; margin-right:6px; vertical-align:1px}

/* hero: next game */
.hero{background:var(--hero-bg); color:var(--hero-ink); border-radius:18px; padding:18px; display:grid; gap:14px; min-width:0}
.hero .eyebrow{font:600 12px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--hero-accent)}
.hero .when{font:700 46px/.95 var(--f-display); text-transform:uppercase; letter-spacing:.01em}
.hero .vs{font:600 26px/1.1 var(--f-display); margin-top:6px; text-wrap:balance}
.hero .meta{color:var(--hero-sub); font-size:14px; margin-top:6px}
.hero .chip{border-color:rgba(255,255,255,.4); color:var(--hero-sub)}
.hero .counts, .hero details summary{color:var(--hero-sub)}
.hero .counts strong{color:var(--hero-ink)}
.hero details summary{color:var(--hero-ink)}
.hero .rsvp button{border-color:rgba(255,255,255,.4); color:var(--hero-ink)}
.hero .rsvp button[aria-pressed="true"]{background:#fff; color:#8F0311; border-color:#fff}
.hero :focus-visible{outline-color:#fff}

/* season strip */
.stats{display:grid; grid-template-columns:repeat(3,1fr)}
.stat{padding:0 12px; border-left:1px solid var(--line); min-width:0}
.stat:first-child{border-left:0; padding-left:0}
.stat b{display:block; font:700 32px/1 var(--f-display); font-variant-numeric:tabular-nums}
.stat span{display:block; margin-top:4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.formrow{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
.form{display:flex; gap:6px}

/* games */
.game{display:grid; gap:14px}
.ghead{display:flex; gap:14px; align-items:center; min-width:0}
.date{flex:none; width:54px; text-align:center; border-radius:10px; background:var(--soft); padding:7px 0}
.date b{display:block; font:700 27px/1 var(--f-display); font-variant-numeric:tabular-nums}
.date span{display:block; margin-top:2px; font:600 11px var(--f-body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.ghead h3{margin:0; font:600 21px/1.15 var(--f-display); letter-spacing:.01em}
.ghead p{margin:3px 0 0; color:var(--muted); font-size:13px}
.ghead > div{min-width:0}
.list{padding-block:4px}
.row{display:flex; gap:14px; align-items:center; padding:12px 0; border-top:1px solid var(--line); text-decoration:none; color:inherit; min-width:0}
.row:first-child{border-top:0}
.row > div:last-child{min-width:0}
.row h3{margin:0; font:600 19px/1.15 var(--f-display)}
.row p{margin:3px 0 0; color:var(--muted); font-size:13px}
.res{padding:0}
.res summary, .res .sum{list-style:none; display:flex; align-items:center; gap:14px; padding:14px 16px; min-height:56px}
.res summary{cursor:pointer}
.res summary::-webkit-details-marker{display:none}
.res .score{margin-left:auto; text-align:right; font:700 24px/1 var(--f-display); font-variant-numeric:tabular-nums; white-space:nowrap}
.res .score .dot{display:inline-grid; vertical-align:middle; margin-left:8px}
.res .body{padding:0 16px 14px}
.cap{margin:0 0 6px; font-size:12px; color:var(--muted)}
.dot{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font:700 12px var(--f-body); color:var(--solid-ink)}
.dot.w{background:var(--win)} .dot.l{background:var(--loss)}

/* tables */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:9px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.tm, th.tm{text-align:left; white-space:normal}
th{font:600 11px var(--f-body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
tr.me td{font-weight:700; background:var(--soft)}
tbody tr:last-child td{border-bottom:0}

/* squad */
.sub{font-size:12px; color:var(--muted)}
.players{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.pl{display:grid; gap:2px; align-content:start}
.pl .no{font:700 42px/1 var(--f-display); color:var(--accent); font-variant-numeric:tabular-nums}
.pl .nm{font-weight:600; margin-top:4px}
.pl .ps{font-size:13px; color:var(--muted)}

/* rsvp */
.rsvp{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.rsvp button{min-height:44px; padding:6px 4px; border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:background-color .12s, border-color .12s}
.rsvp button[aria-pressed="true"][data-v="yes"]{background:var(--win); border-color:var(--win); color:var(--solid-ink)}
.rsvp button[aria-pressed="true"][data-v="maybe"]{background:var(--court); border-color:var(--court); color:var(--solid-ink)}
.rsvp button[aria-pressed="true"][data-v="no"]{background:var(--loss); border-color:var(--loss); color:var(--solid-ink)}
.counts{display:flex; flex-wrap:wrap; gap:2px 14px; margin-top:10px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.counts strong{color:var(--ink)}
details.whoD summary{cursor:pointer; font-size:13px; font-weight:600; margin-top:8px; color:var(--court)}
.who p{margin:4px 0 0; font-size:13px}
.info{display:grid; gap:4px}
.info b{font-weight:600}
.info span{color:var(--muted)}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; max-width:640px; margin:0 auto}
.tabs a{display:grid; place-items:center; min-height:46px; border-radius:10px; color:var(--muted); text-decoration:none; font:600 13px var(--f-body)}
.tabs a[aria-current="page"]{background:var(--soft); color:var(--ink); box-shadow:inset 0 -3px 0 var(--gold)}

:focus-visible{outline:3px solid var(--court); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

/* ---------- Hilfsfunktionen ---------- */
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var TABS=['home','games','standings','squad','training'];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
var now=new Date();
var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function daysTo(d){return Math.round((d-today)/864e5)}
function when(n){return n<=0?'today':n===1?'tomorrow':'in '+n+' days'}
function short(d){return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]}
function ord(n){var v=n%100,x=['th','st','nd','rd'];return n+(x[(v-20)%10]||x[v]||x[0])}
function signed(n){return n>0?'+'+n:n<0?'−'+Math.abs(n):'0'}
function isHome(g){return g.h.indexOf(CLUB)===0}
function opp(g){return isHome(g)?g.a:g.h}
function title(g){return esc(g.h)+' – '+esc(g.a)}
function venue(g){return isHome(g)?'Home':'Away'}
function sub(g){return (g.lg===CUP?'<span class="chip">Cup</span>':'')+(g.round?esc(g.round)+' · ':'')+venue(g)+(g.place?' · '+esc(g.place):'')}
function score(g){return isHome(g)?g.us+':'+g.them:g.them+':'+g.us}
function sorted(list){return list.slice().sort(function(a,b){return (a.date+(a.time||''))<(b.date+(b.time||''))?-1:1})}
function buildGames(){
  var played=[];
  PLAYED.forEach(function(r,i){
    var h=T[r[1]], a=T[r[2]];
    if(h===CLUB||a===CLUB){
      var g={id:'r'+i,date:r[0],h:h,a:a,us:h===CLUB?r[3]:r[4],them:h===CLUB?r[4]:r[3],lg:LEAGUE};
      var bx=BOX[r[0]]; if(bx){g.q=bx.q; g.box=bx.p}
      played.push(Object.assign(g,META[r[0]]||{}));
    }
  });
  return FIXTURES.concat(played,CUPGAMES);
}
var GAMES=buildGames();
function upcoming(){return sorted(GAMES.filter(function(g){return g.us==null&&pd(g.date)>=today}))}
function results(){return sorted(GAMES.filter(function(g){return g.us!=null})).reverse()}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pname(p){return p.g.split(' ')[0]+' '+p.s}
function trainings(){
  var out=[];
  for(var i=0;i<30&&out.length<8;i++){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    TRAINING_WEEK.forEach(function(w){
      if(w.d===d.getDay()&&out.length<8) out.push({id:'t'+dstr(d).replace(/-/g,''),date:d,time:w.t});
    });
  }
  return out;
}
function standings(){
  var m={};
  Object.keys(T).forEach(function(k){m[T[k]]={t:T[k],w:0,l:0,pf:0,pa:0,me:T[k]===CLUB}});
  PLAYED.forEach(function(r){
    var h=m[T[r[1]]], a=m[T[r[2]]];
    h.pf+=r[3]; h.pa+=r[4]; a.pf+=r[4]; a.pa+=r[3];
    if(r[3]>r[4]){h.w++;a.l++}else{a.w++;h.l++}
  });
  var rows=Object.keys(m).map(function(k){var x=m[k];x.sp=x.w+x.l;x.pts=2*x.w+x.l;x.d=x.pf-x.pa;return x});
  rows.sort(function(a,b){return b.pts-a.pts||b.d-a.d});
  return rows;
}

var LS='heffingen-rsvp-v1';

var all={}, myId=null, user=null, db=null, canSync=false, ready=false, slow=false, writeFailed=false;

function loadLocal(){try{var v=JSON.parse(localStorage.getItem(LS)||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(answers))}catch(e){}}
function selfKey(){return canSync?myId:'me'}
function tally(eid){
  var merged=canSync?Object.assign({},all):{};
  merged[selfKey()]={answers:answers};
  var t={yes:[],maybe:[],no:[]};
  Object.keys(merged).forEach(function(uid){
    var a=merged[uid]&&merged[uid].answers, v=a&&a[eid];
    if(t[v]) t[v].push(uid);
  });
  return t;
}

/* ---------- Bausteine ---------- */
function rsvp(eid,names){
  var cur=answers[eid];
  function b(v,l){return '<button type="button" data-rsvp="'+eid+'" data-v="'+v+'" aria-pressed="'+(cur===v)+'">'+l+'</button>'}
  var t=tally(eid), total=t.yes.length+t.maybe.length+t.no.length;
  var h='<div><div class="rsvp" role="group" aria-label="Your response">'+b('yes','Going')+b('maybe','Maybe')+b('no','Not going')+'</div>'
    +'<div class="counts"><span><strong>'+t.yes.length+'</strong> going</span><span><strong>'+t.maybe.length+'</strong> maybe</span><span><strong>'+t.no.length+'</strong> not going</span></div>';
  if(names&&total>0){
    h+='<details class="whoD" data-key="who-'+eid+'"><summary>Who has replied?</summary><div class="who" data-eid="'+eid+'"></div></details>';
  }
  return h+'</div>';
}
function note(){
  if(!ready) return '';
  if(!canSync) return '<p class="note">Responses are saved on this device only.</p>';
  if(writeFailed) return '<p class="note">Your last response could not be saved for the team. It stays on this device.</p>';
  if(slow) return '<p class="note">Team responses are still loading.</p>';
  return '';
}
function dateBox(d){return '<div class="date"><b>'+d.getDate()+'</b><span>'+MO[d.getMonth()]+'</span></div>'}
function empty(head,text){return '<div class="card empty"><b>'+head+'</b><p>'+text+'</p></div>'}

function vStart(){
  var up=upcoming(), r=results(), h=note();
  if(up.length){
    var ng=up[0], d=pd(ng.date);
    h+='<section class="hero" aria-label="Next game"><div><div class="eyebrow">Next game · '+when(daysTo(d))+'</div>'

      +'<div class="meta">'+sub(ng)+(ng.addr?'<br>'+esc(ng.addr):'')+'</div></div>'
      +rsvp(ng.id,false)+'</section>';

    h+=empty('No more games','There are no upcoming games in the schedule.');
  }

    var st=standings(), rank=st.findIndex(function(x){return x.me})+1, me=st[rank-1];

      +'<div class="stat"><b>'+w+'–'+l+'</b><span>Record</span></div>'

  }

    h+='<h2 class="sec">After that</h2><div class="card list">';

  var h='<h2 class="sec">'+LEAGUE+' Men</h2><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th class="tm">Team</th><th>P</th><th>W</th><th>L</th><th>Diff</th><th>Pts</th></tr></thead><tbody>';
  st.forEach(function(x,i){
    h+='<tr'+(x.me?' class="me"':'')+'><td>'+(i+1)+'</td><td class="tm">'+esc(x.t)+'</td><td>'+x.sp+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td>'+signed(x.d)+'</td><td>'+x.pts+'</td></tr>';
  });
  return h+'</tbody></table></div></div><p class="note">Calculated from the results on luxembourg.basketball (as of 11 Nov 2026): two points for a win, one for a loss, ties broken by point difference. The official table may differ.</p>';
}

function squadStats(){
  var m={};
  Object.keys(BOX).sort().forEach(function(d){
    BOX[d].p.forEach(function(r){
      var x=m[r[0]]||(m[r[0]]={id:r[0],gp:0,pts:0,three:0,n:null});
      x.gp++; x.pts+=r[2]; x.three+=r[5]; x.n=r[1];
    });
  });
  return Object.keys(m).map(function(k){var x=m[k];x.ppg=x.pts/x.gp;return x})
    .sort(function(a,b){return b.ppg-a.ppg||b.pts-a.pts});
}
function vKader(){
  var rows=squadStats();
  if(!rows.length) return empty('Squad coming soon','Players have not been added yet.');
  var h='<h2 class="sec">Season stats · '+LEAGUE+'</h2><div class="card"><div class="scroll"><table><thead><tr><th>#</th><th class="tm">Player</th><th>GP</th><th>PTS</th><th>PPG</th><th>3PM</th></tr></thead><tbody>';
  rows.forEach(function(x){
    var p=PLAYERS[x.id];
    h+='<tr><td>'+x.n+'</td><td class="tm">'+esc(pname(p))+(p.pos?'<br><span class="sub">'+POS[p.pos]+(p.h?' · '+esc(p.h)+' m':'')+'</span>':'')+'</td><td>'+x.gp+'</td><td>'+x.pts+'</td><td>'+x.ppg.toFixed(1)+'</td><td>'+x.three+'</td></tr>';
  });
  return h+'</tbody></table></div></div><p class="note">From the match reports of the '+Object.keys(BOX).length+' league games played so far (as of 11 Nov 2026). The number is each player’s shirt number in his latest game. GP = games played, PPG = points per game, 3PM = three-pointers made.</p>';
}

function vTraining(){
  var list=trainings();
  var h=note()+'<div class="card info"><b>Weekly training</b>'
    +TRAINING_WEEK.map(function(w){return '<span>'+WD[w.d]+' · '+w.t+'</span>'}).join('')+'</div>'
    +'<h2 class="sec">Upcoming sessions</h2>';
  list.forEach(function(s){
    var gm=GAMES.filter(function(g){return g.date===dstr(s.date)})[0];
    h+='<article class="card game"><div class="ghead">'+dateBox(s.date)
      +'<div><h3>'+short(s.date)+'</h3><p>'+esc(s.time)+' · '+when(daysTo(s.date))+'</p>'
      +(gm?'<p>Game day · '+gm.time+' · '+title(gm)+'</p>':'')+'</div></div>'+rsvp(s.id,true)+'</article>';
  });
  return h;
}

var VIEWS={home:vStart,games:vSpiele,standings:vTabelle,squad:vKader,training:vTraining};

/* ---------- Rendern ---------- */
function current(){var v=location.hash.slice(1);return TABS.indexOf(v)>-1?v:'home'}
function render(){
  var v=current();
  TABS.forEach(function(t){document.getElementById('v-'+t).hidden=(t!==v)});
  document.querySelectorAll('.tabs a').forEach(function(a){
    if(a.dataset.tab===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  var el=document.getElementById('v-'+v);
  el.innerHTML=VIEWS[v]();
  el.querySelectorAll('details[data-key]').forEach(function(d){d.open=openKeys.has(d.dataset.key)});
  fillWho();
}
function fillWho(){
  var tok=++whoTok;
  var nodes=Array.prototype.slice.call(document.querySelectorAll('.who[data-eid]'));
  if(!nodes.length) return;
  var ids={};
  nodes.forEach(function(n){var t=tally(n.dataset.eid);t.yes.concat(t.maybe,t.no).forEach(function(i){ids[i]=1})});
  var ask=(user&&canSync)?user.profiles(Object.keys(ids)):Promise.resolve({});
  ask.catch(function(){return {}}).then(function(ps){
    if(tok!==whoTok) return;
    function nm(id){var p=ps&&ps[id];return id===selfKey()?'You':((p&&p.name)||'Team member')}
    nodes.forEach(function(n){
      var t=tally(n.dataset.eid);
      n.textContent='';
      [['yes','Going'],['maybe','Maybe'],['no','Not going']].forEach(function(k){
        if(!t[k[0]].length) return;
        var p=document.createElement('p'), s=document.createElement('strong');
        s.textContent=k[1]+': ';
        p.appendChild(s);
        p.appendChild(document.createTextNode(t[k[0]].map(nm).join(', ')));
        n.appendChild(p);
      });
    });
  });
}

/* ---------- Antworten speichern ---------- */
function setAnswer(eid,v){
  var next=Object.assign({},answers);
  if(next[eid]===v) delete next[eid]; else next[eid]=v;
  answers=next; saveLocal(); render();
  var f=document.querySelector('[data-rsvp="'+eid+'"][data-v="'+v+'"]');
  if(f&&f.focus) f.focus({preventScroll:true});
  if(canSync) flush();
}
function flush(){
  if(writing){dirty=true;return}
  writing=true;
  (function loop(){
    dirty=false;
    db.doc('rsvp/'+myId).set({answers:answers}).then(function(){
      writeFailed=false;
      if(dirty) loop(); else {writing=false;render()}
    },function(){
      writeFailed=true;writing=false;render();
    });
  })();
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-rsvp]');
  if(b) setAnswer(b.dataset.rsvp,b.dataset.v);
});
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(d&&d.dataset&&d.dataset.key){ if(d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key); }
},true);
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

/* ---------- Start ---------- */
render();
(async function boot(){
  try{
    var c=window.claude;
    if(c&&c.use){ user=await c.use('user'); db=await c.use('db'); }
    if(user) myId=await user.id();
  }catch(e){}
  canSync=!!(db&&myId&&user);
  ready=true;
  if(canSync){
    var timer=setTimeout(function(){slow=true;render()},10000);
    try{
      db.collection('rsvp').onSnapshot(function(snap){
        if(!snap.metadata.fromCache){clearTimeout(timer);slow=false}
        var next={};
        snap.docs.forEach(function(d){next[d.id]=d.data()});
        all=next;
        var mine=all[myId];
        if(mine&&mine.answers&&!writing){answers=Object.assign({},mine.answers);saveLocal()}
        render();
      },function(){clearTimeout(timer);slow=false;canSync=false;render()});
    }catch(e){clearTimeout(timer);canSync=false}
  }
  render();
})();
})();
</script>
